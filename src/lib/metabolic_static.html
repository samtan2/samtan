<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="metabolic">
<meta name="theme-color" content="#111110">
<link rel="manifest" href="/manifest.json">
<title>metabolic</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Inter","Helvetica Neue",sans-serif; font-size: 13px; background: #111110; color: #e8e6e0; user-select: none; -webkit-user-select: none; }
.cockpit { padding: 16px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #444441; }
.header-right { display: flex; align-items: center; gap: 10px; }
.clock-val { font-size: 11px; color: #444441; }
.gear-btn { background: transparent; border: none; cursor: pointer; color: #444441; font-size: 15px; padding: 0; line-height: 1; transition: color 0.15s; }
.gear-btn:hover { color: #888780; }
.section-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #444441; margin-bottom: 6px; }

/* ring */
.ring-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; }
.ring-container { position: relative; width: 180px; height: 180px; }
.ring-svg { width: 180px; height: 180px; }
.ring-track { fill: none; stroke: #1a1a18; stroke-width: 10; }
.ring-fill { fill: none; stroke-width: 10; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 0.6s ease, stroke 1.5s; }
.ring-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.ring-elapsed { font-size: 32px; font-weight: 500; color: #e8e6e0; letter-spacing: -0.02em; line-height: 1; }
.ring-sub { font-size: 11px; color: #444441; margin-top: 3px; }
.ring-badge { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 99px; margin-top: 6px; display: inline-block; }
.ring-state { font-size: 11px; font-weight: 500; color: #888780; margin-top: 2px; }
.ring-next { font-size: 10px; color: #444441; margin-top: 2px; }
.b-fast    { background: #26215c; color: #afa9ec; }
.b-refeed  { background: #412402; color: #ef9f27; }
.b-ready   { background: #04342c; color: #5dcaa5; }
.b-idle    { background: #2c2c2a; color: #888780; }
.b-paused  { background: #1a1926; color: #7f77dd; }

/* two-column button row */
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.phase-btn { padding: 9px 12px; border-radius: 8px; font-size: 12px; font-family: inherit; cursor: pointer; transition: all 0.2s; border: 0.5px solid #2c2c2a; background: transparent; color: #444441; position: relative; }
/* fast button states */
.phase-btn.fast-idle   { color: #888780; }
.phase-btn.fast-idle:hover { border-color: #0f6e56; background: #04342c; color: #5dcaa5; }
.phase-btn.fast-run    { border-color: #0f6e56; background: #04342c; color: #5dcaa5; }
.phase-btn.fast-run:hover { border-color: #a32d2d; background: #1a0808; color: #f09595; }
.phase-btn.fast-pause  { border-color: #534ab7; background: #1a1926; color: #7f77dd; }
.phase-btn.fast-pause:hover { border-color: #0f6e56; background: #04342c; color: #5dcaa5; }
/* refeed button states */
.phase-btn.refeed-idle  { color: #888780; }
.phase-btn.refeed-idle:hover { border-color: #854f0b; background: #1a1108; color: #ef9f27; }
.phase-btn.refeed-run   { border-color: #854f0b; background: #1a1108; color: #ef9f27; }
.phase-btn.refeed-run:hover { border-color: #a32d2d; background: #1a0808; color: #f09595; }
.phase-btn.refeed-pause { border-color: #534ab7; background: #1a1926; color: #7f77dd; }
.phase-btn.refeed-pause:hover { border-color: #854f0b; background: #1a1108; color: #ef9f27; }
.phase-btn.ready        { border-color: #0f6e56; color: #5dcaa5; animation: pg 2s infinite; }
@keyframes pg { 0%,100%{box-shadow:0 0 0 0 rgba(29,158,117,0)} 50%{box-shadow:0 0 0 4px rgba(29,158,117,0.12)} }
.btn-hint { font-size: 9px; color: #444441; text-align: center; margin-bottom: 12px; }

/* sliders */
.slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.slider-row input[type=range] { flex: 1; }
.slider-row input[type=range].fast-range  { accent-color: #534ab7; }
.slider-row input[type=range].refeed-range { accent-color: #ef9f27; }
.slider-row input[type=range]:disabled { opacity: 0.2; cursor: not-allowed; }
.slider-label { font-size: 11px; color: #444441; min-width: 52px; }
.slider-val   { font-size: 12px; font-weight: 500; color: #e8e6e0; min-width: 32px; text-align: right; }
.slider-hint  { font-size: 10px; color: #333331; margin-bottom: 12px; }
.slider-hint.a { color: #534ab7; }
.slider-hint.b { color: #ef9f27; }

/* string */
.string-block { border: 0.5px solid #2c2c2a; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #161614; }
.string-input { width: 100%; background: transparent; border: none; outline: none; font-size: 15px; font-weight: 500; color: #e8e6e0; font-family: inherit; line-height: 1.3; caret-color: #5dcaa5; user-select: text; -webkit-user-select: text; }
.string-input::placeholder { color: #2c2c2a; font-weight: 400; }
.string-divider { height: 0.5px; background: #2c2c2a; margin: 8px 0; }
.string-meta { font-size: 11px; color: #444441; }

/* arc */
.arc { display: flex; align-items: center; margin-bottom: 12px; overflow: hidden; }
.arc-step { display: flex; flex-direction: column; align-items: center; flex: 1; }
.arc-dot { width: 8px; height: 8px; border-radius: 50%; background: #2c2c2a; border: 1.5px solid #2c2c2a; position: relative; z-index: 1; }
.arc-dot.done    { background: #1d9e75; border-color: #1d9e75; }
.arc-dot.cur     { background: #534ab7; border-color: #534ab7; width: 11px; height: 11px; }
.arc-dot.prev    { background: #534ab7; border-color: #534ab7; opacity: 0.4; width: 11px; height: 11px; }
.arc-dot.rdone   { background: #ef9f27; border-color: #ef9f27; }
.arc-dot.rcur    { background: #ef9f27; border-color: #ef9f27; width: 11px; height: 11px; }
.arc-line { flex: 1; height: 1px; background: #2c2c2a; margin-top: -5px; }
.arc-line.done   { background: #1d9e75; }
.arc-line.prev   { background: #534ab7; opacity: 0.3; }
.arc-line.rdone  { background: #ef9f27; }
.arc-label { font-size: 9px; color: #333331; margin-top: 4px; text-align: center; white-space: nowrap; overflow: hidden; max-width: 44px; text-overflow: ellipsis; }
.arc-label.done  { color: #1d9e75; }
.arc-label.cur   { color: #534ab7; font-weight: 500; }
.arc-label.prev  { color: #534ab7; opacity: 0.5; }
.arc-label.rdone { color: #ef9f27; }
.arc-label.rcur  { color: #ef9f27; font-weight: 500; }

/* state block */
.state-block { border: 0.5px solid #2c2c2a; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #161614; }
.state-name { font-size: 15px; font-weight: 500; color: #e8e6e0; margin-bottom: 4px; }
.state-desc { font-size: 12px; color: #888780; line-height: 1.5; margin-bottom: 6px; }
.next-hint  { font-size: 11px; }
.next-fast  { color: #5dcaa5; }
.next-refeed{ color: #ef9f27; }
.active-note { padding: 10px 12px; border-radius: 8px; border: 0.5px solid #0f6e56; background: #04342c; font-size: 12px; color: #5dcaa5; line-height: 1.5; margin-bottom: 12px; }

/* compounds */
.compound-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
.compound-row  { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 6px; border: 0.5px solid #2c2c2a; background: #161614; }
.compound-text { flex: 1; }
.compound-name { font-size: 13px; font-weight: 500; color: #e8e6e0; cursor: pointer; }
.compound-why  { font-size: 11px; color: #444441; margin-top: 1px; cursor: pointer; }
.compound-name.ed { background: transparent; border: none; outline: none; font-size: 13px; font-weight: 500; color: #e8e6e0; font-family: inherit; width: 100%; user-select: text; -webkit-user-select: text; caret-color: #5dcaa5; border-bottom: 0.5px solid #534ab7; }
.compound-why.ed  { background: transparent; border: none; outline: none; font-size: 11px; color: #888780; font-family: inherit; width: 100%; user-select: text; -webkit-user-select: text; caret-color: #5dcaa5; border-bottom: 0.5px solid #2c2c2a; margin-top: 2px; }
.compound-actions { display: flex; gap: 4px; flex-shrink: 0; }
.compound-check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #2c2c2a; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
.compound-check:hover { border-color: #1d9e75; }
.compound-check.done { background: #1d9e75; border-color: #1d9e75; }
.compound-check.done::after { content: ''; display: block; width: 5px; height: 9px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translateY(-1px); }
.remove-btn { width: 20px; height: 20px; border-radius: 4px; border: none; background: transparent; cursor: pointer; color: #333331; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: color 0.15s; }
.remove-btn:hover { color: #f09595; }
.add-compound-btn { width: 100%; padding: 7px; border-radius: 6px; border: 0.5px dashed #2c2c2a; background: transparent; font-size: 11px; color: #333331; font-family: inherit; cursor: pointer; margin-bottom: 12px; transition: all 0.15s; }
.add-compound-btn:hover { border-color: #444441; color: #888780; }
.cpicker { background: #1a1a18; border: 0.5px solid #2c2c2a; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
.cpicker select { width: 100%; font-size: 12px; padding: 7px 8px; border-radius: 6px; border: 0.5px solid #2c2c2a; background: #111110; color: #e8e6e0; font-family: inherit; cursor: pointer; margin-bottom: 8px; }
.cpicker select:focus { outline: none; border-color: #534ab7; }
.cpicker-new { display: none; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.cpicker-new.vis { display: flex; }
.cpicker-new input { font-size: 12px; padding: 6px 8px; border-radius: 6px; border: 0.5px solid #2c2c2a; background: #111110; color: #e8e6e0; font-family: inherit; user-select: text; -webkit-user-select: text; caret-color: #5dcaa5; }
.cpicker-new input:focus { outline: none; border-color: #534ab7; }
.cpicker-new input::placeholder { color: #2c2c2a; }
.cpicker-actions { display: flex; gap: 6px; }
.cpicker-ok  { flex: 1; padding: 6px; border-radius: 6px; border: 0.5px solid #0f6e56; background: #04342c; color: #5dcaa5; font-family: inherit; font-size: 12px; cursor: pointer; }
.cpicker-ok:hover { background: #085041; }
.cpicker-no  { padding: 6px 12px; border-radius: 6px; border: 0.5px solid #2c2c2a; background: transparent; color: #888780; font-family: inherit; font-size: 12px; cursor: pointer; }
.cpicker-no:hover { background: #2c2c2a; }

/* controls */
.controls { display: grid; grid-template-columns: repeat(2,1fr); gap: 6px; margin-bottom: 12px; }
.ctrl { display: flex; flex-direction: column; gap: 3px; }
.ctrl label { font-size: 10px; color: #444441; letter-spacing: 0.06em; text-transform: uppercase; }
.ctrl label.lit { color: #888780; }
.ctrl select { font-size: 12px; padding: 7px 8px; border-radius: 6px; border: 0.5px solid #2c2c2a; background: #1a1a18; color: #e8e6e0; font-family: inherit; cursor: pointer; }
.ctrl select:focus { outline: none; border-color: #534ab7; }
.ctrl select:disabled { opacity: 0.3; cursor: not-allowed; }
.pill-group { display: flex; gap: 4px; }
.pill { flex: 1; padding: 6px 4px; border-radius: 6px; border: 0.5px solid #2c2c2a; background: transparent; font-size: 11px; color: #444441; font-family: inherit; cursor: pointer; text-align: center; transition: all 0.15s; }
.pill:hover:not(:disabled) { border-color: #444441; color: #888780; }
.pill.on-fast   { border-color: #534ab7; background: #1a1926; color: #afa9ec; }
.pill.on-refeed { border-color: #854f0b; background: #1a1108; color: #ef9f27; }
.pill:disabled  { opacity: 0.25; cursor: not-allowed; }
.refeed-hint { font-size: 10px; color: #333331; grid-column: span 2; text-align: right; }
.pill.ghost { opacity: 0.35; border-style: dashed; border-color: #854f0b !important; color: #ef9f27 !important; background: #1a1108 !important; }

/* snapshot */
.anchor-block { border: 0.5px solid #2c2c2a; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #161614; }
.anchor-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.anchor-sel { flex: 1; font-size: 12px; padding: 6px 8px; border-radius: 6px; border: 0.5px solid #2c2c2a; background: #111110; color: #e8e6e0; font-family: inherit; cursor: pointer; }
.anchor-sel:focus { outline: none; border-color: #534ab7; }
.anchor-time-label { font-size: 13px; font-weight: 500; color: #afa9ec; min-width: 44px; text-align: right; }
.anchor-timeline { display: flex; flex-direction: column; gap: 4px; }
.tl-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 0.5px solid #1a1a18; }
.tl-row:last-child { border-bottom: none; }
.tl-time { font-size: 11px; font-weight: 500; color: #e8e6e0; min-width: 44px; }
.tl-name { font-size: 11px; color: #444441; flex: 1; }
.tl-row.anchor-row-hl .tl-time { color: #afa9ec; }
.tl-row.anchor-row-hl .tl-name { color: #afa9ec; }
.tl-row.meal-row .tl-time { color: #ef9f27; }
.tl-row.meal-row .tl-name { color: #ef9f27; }
.snapshot-btn { width: 100%; padding: 9px; border-radius: 6px; border: 0.5px solid #2c2c2a; background: transparent; font-size: 12px; color: #888780; font-family: inherit; cursor: pointer; margin-bottom: 10px; transition: all 0.15s; }
.snapshot-btn:hover { background: #1a1a18; color: #e8e6e0; }
.snapshot-btn.sent { border-color: #0f6e56; color: #5dcaa5; }
.log-list { display: flex; flex-direction: column; gap: 4px; }
.log-entry { font-size: 11px; padding: 7px 10px; background: #1a1a18; border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; }
.log-left  { color: #888780; white-space: nowrap; }
.log-right { color: #444441; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* onboarding */
.onboard { display: flex; flex-direction: column; align-items: center; padding: 32px 16px; gap: 14px; }
.onboard-title { font-size: 15px; font-weight: 500; color: #e8e6e0; text-align: center; }
.onboard-sub   { font-size: 12px; color: #444441; text-align: center; }
.onboard-btn   { width: 100%; padding: 12px; border-radius: 8px; border: 0.5px solid #2c2c2a; background: transparent; font-size: 13px; color: #888780; font-family: inherit; cursor: pointer; transition: all 0.2s; text-align: left; }
.onboard-btn:hover { background: #1a1a18; color: #e8e6e0; border-color: #444441; }
.onboard-btn.sel { border-color: #534ab7; background: #1a1926; color: #afa9ec; }
.onboard-slider { display: none; width: 100%; }
.onboard-slider-row { display: flex; align-items: center; gap: 10px; }
.onboard-slider-row input { flex: 1; accent-color: #534ab7; }
.onboard-slider-val { font-size: 13px; font-weight: 500; color: #e8e6e0; min-width: 36px; text-align: right; }
.onboard-confirm { width: 100%; padding: 10px; border-radius: 99px; border: 0.5px solid #0f6e56; background: #04342c; color: #5dcaa5; font-family: inherit; font-size: 13px; cursor: pointer; display: none; }
.onboard-confirm:hover { background: #085041; }

/* settings overlay */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 20px 16px; }
.overlay.open { display: flex; }
.panel { background: #161614; border: 0.5px solid #2c2c2a; border-radius: 12px; padding: 20px; width: 100%; max-width: 320px; }
.panel-title    { font-size: 13px; font-weight: 500; color: #e8e6e0; margin-bottom: 4px; }
.panel-subtitle { font-size: 11px; color: #444441; margin-bottom: 16px; }
.panel-section  { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #444441; margin-bottom: 10px; }
.sed-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.sed-row  { background: #1a1a18; border: 0.5px solid #2c2c2a; border-radius: 8px; padding: 10px 12px; }
.sed-hdr  { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.sed-name { flex: 1; background: transparent; border: none; outline: none; font-size: 13px; font-weight: 500; color: #e8e6e0; font-family: inherit; user-select: text; -webkit-user-select: text; border-bottom: 0.5px solid #2c2c2a; caret-color: #5dcaa5; }
.sed-name:focus { border-bottom-color: #534ab7; }
.sed-thresh { width: 48px; background: transparent; border: none; outline: none; font-size: 12px; color: #888780; font-family: inherit; text-align: right; user-select: text; -webkit-user-select: text; border-bottom: 0.5px solid #2c2c2a; caret-color: #5dcaa5; }
.sed-thresh:focus { border-bottom-color: #534ab7; }
.sed-unit { font-size: 10px; color: #444441; }
.sed-rem  { background: transparent; border: none; cursor: pointer; color: #333331; font-size: 13px; padding: 0; }
.sed-rem:hover { color: #f09595; }
.sed-desc { width: 100%; background: transparent; border: none; outline: none; font-size: 11px; color: #888780; font-family: inherit; margin-bottom: 6px; user-select: text; -webkit-user-select: text; border-bottom: 0.5px solid #1a1a18; caret-color: #5dcaa5; resize: none; }
.sed-desc:focus { border-bottom-color: #2c2c2a; }
.sed-clbl { font-size: 10px; color: #333331; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
.sed-crow { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.sed-cn   { flex: 1; background: transparent; border: none; outline: none; font-size: 12px; color: #888780; font-family: inherit; user-select: text; -webkit-user-select: text; border-bottom: 0.5px solid #1a1a18; caret-color: #5dcaa5; }
.sed-cw   { flex: 1.5; background: transparent; border: none; outline: none; font-size: 11px; color: #444441; font-family: inherit; user-select: text; -webkit-user-select: text; border-bottom: 0.5px solid #1a1a18; caret-color: #5dcaa5; }
.sed-cn:focus, .sed-cw:focus { border-bottom-color: #2c2c2a; }
.sed-crem { background: transparent; border: none; cursor: pointer; color: #333331; font-size: 13px; padding: 0 2px; }
.sed-crem:hover { color: #f09595; }
.sed-cadd { background: transparent; border: none; cursor: pointer; font-size: 11px; color: #333331; font-family: inherit; padding: 2px 0; margin-top: 2px; }
.sed-cadd:hover { color: #888780; }
.add-state-btn { width: 100%; padding: 8px; border-radius: 6px; border: 0.5px dashed #2c2c2a; background: transparent; font-size: 12px; color: #444441; font-family: inherit; cursor: pointer; margin-bottom: 12px; }
.add-state-btn:hover { border-color: #444441; color: #888780; }
.pdivider { height: 0.5px; background: #2c2c2a; margin: 16px 0; }
.prow  { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.prow label { font-size: 12px; color: #888780; }
.prow-wrap { display: flex; align-items: center; gap: 4px; }
.prow input[type=number] { width: 56px; padding: 5px 8px; border-radius: 6px; border: 0.5px solid #2c2c2a; background: #1a1a18; color: #e8e6e0; font-family: inherit; font-size: 12px; text-align: right; user-select: text; -webkit-user-select: text; }
.prow input:focus { outline: none; border-color: #534ab7; }
.phint { font-size: 10px; color: #444441; }
.pfooter { display: flex; gap: 8px; margin-top: 16px; }
.psave   { flex: 1; padding: 8px; border-radius: 6px; border: 0.5px solid #0f6e56; background: #04342c; color: #5dcaa5; font-family: inherit; font-size: 12px; cursor: pointer; }
.psave:hover { background: #085041; }
.pcancel { padding: 8px 16px; border-radius: 6px; border: 0.5px solid #2c2c2a; background: transparent; color: #888780; font-family: inherit; font-size: 12px; cursor: pointer; }
.pcancel:hover { background: #1a1a18; }
.preset-link { font-size: 10px; color: #333331; cursor: pointer; text-align: center; margin-top: 8px; }
.preset-link:hover { color: #f09595; }
</style>
</head>
<body>



<!-- main cockpit -->
<div class="cockpit" id="main-screen" style="display:none">
  <div class="header">
    <span class="title">metabolic</span>
    <div class="header-right">
      <span class="clock-val" id="clock"></span>
      <button class="gear-btn" id="gear-btn">⚙</button>
    </div>
  </div>

  <!-- ring -->
  <div class="ring-wrap">
    <div class="ring-container">
      <svg class="ring-svg" viewBox="0 0 180 180">
        <circle class="ring-track" cx="90" cy="90" r="80"/>
        <circle class="ring-fill" id="ring-fill" cx="90" cy="90" r="80"/>
      </svg>
      <div class="ring-inner">

<script>
const CIRC = 2 * Math.PI * 80;
const ZONE_C = { fed:'#888780', depleting:'#ef9f27', early_ketosis:'#5dcaa5', deep_ketosis:'#afa9ec' };

const DF = [
  { id:'initiate', name:'initiate',    threshold:0,  desc:'entering the fast. appetite pulling back.', compounds:[{name:'black coffee',why:'appetite suppression, zero calories'},{name:'sparkling water',why:'keeps hunger quiet'}] },
  { id:'sharpen',  name:'sharpen',     threshold:4,  desc:'glycogen clearing. focus coming online.',   compounds:[{name:'green tea',why:'gentle caffeine, l-theanine for clean focus'},{name:'salt + water',why:'electrolyte baseline'}] },
  { id:'pre',      name:'pre-workout', threshold:12, desc:'loading up before the session.',            compounds:[{name:'banana',why:'quick carbs, potassium'},{name:'creatine',why:'strength and power output'}] },
  { id:'active',   name:'active',      threshold:14, desc:'in the session.', note:'water only. stay in the contraction.', compounds:[] },
  { id:'post',     name:'post-workout',threshold:15, desc:'training done. bring it down.',             compounds:[{name:'eggs',why:'complete protein, fast absorption'},{name:'tart cherry juice',why:'reduces muscle soreness'}] },
  { id:'recover',  name:'recover',     threshold:16, desc:'minerals low. support the reset.',          compounds:[{name:'beef + salt',why:'protein and sodium replenishment'},{name:'dark leafy greens',why:'magnesium, iron, micronutrients'}] },
  { id:'buffer',   name:'buffer',      threshold:24, desc:'deep fast. hold the string.',               compounds:[{name:'bone broth',why:'electrolytes, collagen, keeps hunger low'},{name:'salt + water',why:'sodium baseline'}] },
  { id:'extend',   name:'extend fast', threshold:36, desc:'deep ketosis. electrolytes only.',          compounds:[{name:'salt + water',why:'sodium — the main lever at this depth'}] },
];
const DR = [
  { id:'rf_fed',   name:'fed',       threshold:0, desc:'just ate. digestion starting.',               compounds:[{name:'white rice',why:'easy to digest, fast glycogen refill'},{name:'eggs',why:'complete protein to pair with carbs'}] },
  { id:'rf_dig',   name:'digesting', threshold:1, desc:'active digestion. glycogen refilling.',       compounds:[{name:'fruit',why:'fructose fills liver glycogen'},{name:'greek yogurt',why:'protein and probiotics'}] },
  { id:'rf_clear', name:'clearing',  threshold:3, desc:'digestion settling. energy stabilizing.',     compounds:[{name:'creatine',why:'uptake is better post-meal'},{name:'salt + water',why:'rehydrate and replenish'}] },
  { id:'rf_ready', name:'ready',     threshold:6, desc:'glycogen topped. window open for next fast.', compounds:[] },
];

let FS = [], RS = [], cycle = 24;
// phase: 'none' | 'fasting' | 'refeed'
let phase = 'none';
let fastRunning = false, fastPaused = false, fastStart = null, fastPauseOffset = 0, fastElapsedMs = 0;
let refeedRunning = false, refeedPaused = false, refeedStart = null, refeedPauseOffset = 0, refeedElapsedMs = 0;
let mealMult = 1.4, trainCompress = 1.0;
let FT = {}, timerInterval = null, manualId = null;
const checked = new Set(), logs = [];
let adjusting = null; // null | 'ate' | 'trained'
let activePreview = 'fast'; // 'fast' | 'refeed' — which slider was last moved
let preAdjMealMult = 1.4, preAdjTrainCompress = 1.0, preAdjRefeedOffset = 0;
let prevCommitMealMult = 1.4, prevCommitTrainCompress = 1.0; // start with defaults so initial ghost works

// ── persist ──────────────────────────────────────────────────────────────────
const API = null; // static mode — no daemon

function save() {
  try { localStorage.setItem('m_fs', JSON.stringify(FS)); localStorage.setItem('m_rs', JSON.stringify(RS)); localStorage.setItem('m_cfg', JSON.stringify({cycle})); } catch(e) {}
}

function savePhase() {
  const data = { phase, fastRunning, fastPaused, fastStart, fastPauseOffset, refeedRunning, refeedPaused, refeedStart, refeedPauseOffset, mealMult, trainCompress, FT };
  try { localStorage.setItem('m_ph', JSON.stringify(data)); } catch(e) {}
}

async function load() {
  // static mode — use defaults
  FS = JSON.parse(JSON.stringify(DF));
  RS = JSON.parse(JSON.stringify(DR));
}

async function loadPhase() {
  // static mode — start mid-fast at 12h in
  const FAST_OFFSET_H = 12;
  phase = 'fasting';
  fastRunning = true; fastPaused = false;
  fastPauseOffset = FAST_OFFSET_H * 3600000;
  fastStart = Date.now();
  fastElapsedMs = fastPauseOffset;
  mealMult = 1.4; trainCompress = 1.0;
  prevCommitMealMult = 1.4; prevCommitTrainCompress = 1.0;
  FT = {};
  document.getElementById('fast-slider').value = FAST_OFFSET_H;
  document.getElementById('heading-input').value = 'mental clarity · no distractions';
  return true;
}

function saveChecked() {
  try { localStorage.setItem('m_checked', JSON.stringify([...checked])); } catch(e) {}
}

// ── helpers ───────────────────────────────────────────────────────────────────
function sf() { return [...FS].sort((a,b)=>a.threshold-b.threshold); }
function sr() { return [...RS].sort((a,b)=>a.threshold-b.threshold); }
function getFT(s)  { return FT[s.id]!==undefined?FT[s.id]:s.threshold; }
function getRFT(s) { return FT[s.id]!==undefined?FT[s.id]:Math.max(0.5,Math.round(s.threshold*mealMult*trainCompress*10)/10); }
function getZone(h){ return ([[4,'fed'],[12,'depleting'],[20,'early_ketosis'],[72,'deep_ketosis']].find(z=>h<=z[0])||[72,'deep_ketosis'])[1]; }
function inferFast(h){ const s=sf(); let c=s[0]; for(const x of s){if(h>=getFT(x))c=x;else break;} return c.id; }
function inferRefeed(h){ const s=sr(); let c=s[0]; for(const x of s){if(h>=getRFT(x))c=x;else break;} return c.id; }
function getFById(id){ return FS.find(s=>s.id===id)||sf()[0]; }
function getRById(id){ return RS.find(s=>s.id===id)||sr()[0]; }
function isReady(h){ const s=sr(); return h>=getRFT(s[s.length-1]); }
function fmtMs(ms){ const tm=Math.floor(ms/60000),h=Math.floor(tm/60),m=tm%60; if(h===0)return m+'m'; if(m===0)return h+'h'; return h+'h '+m+'m'; }
function getFH(){ if(fastRunning&&!fastPaused&&fastStart) return (fastPauseOffset+(Date.now()-fastStart))/3600000; return fastElapsedMs/3600000; }
function getRH(){ if(refeedRunning&&!refeedPaused&&refeedStart) return (refeedPauseOffset+(Date.now()-refeedStart))/3600000; return refeedElapsedMs/3600000; }
function getSliderFH(){ return parseFloat(document.getElementById('fast-slider').value)||0; }
function getSliderRH(){ return parseFloat(document.getElementById('refeed-slider').value)||0; }
function displayH(){ return fastRunning?getFH():getSliderFH(); }
function displayRH(){ return refeedRunning?getRH():getSliderRH(); }
function applyMealToFast(){ sf().forEach(s=>{ FT[s.id]=Math.round(s.threshold*mealMult); }); }
function netHint(){ const s=sr(); const last=s[s.length-1]; const v=getRFT(last); document.getElementById('refeed-hint').textContent='ready in ~'+(Number.isInteger(v)?v:v.toFixed(1))+'h'; }

// ── timer ─────────────────────────────────────────────────────────────────────
function startTick(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(fastRunning&&!fastPaused&&fastStart) fastElapsedMs=fastPauseOffset+(Date.now()-fastStart);
    if(refeedRunning&&!refeedPaused&&refeedStart) refeedElapsedMs=refeedPauseOffset+(Date.now()-refeedStart);
    checkArcTransition();
    render();
  },30000);
}

// ── fast controls ─────────────────────────────────────────────────────────────
// ── auto logging ─────────────────────────────────────────────────────────────
function autoLog(event, extra) {} // static mode — logging disabled

// track last arc state to detect transitions
let lastArcStateId = null;

function checkArcTransition() {
  const fh = getFH(), rh = getRH();
  const isR = phase === 'refeed';
  const currentId = isR ? inferRefeed(rh) : inferFast(fh);
  if (lastArcStateId && currentId !== lastArcStateId) {
    autoLog('arc_transition', { from: lastArcStateId, to: currentId });
  }
  lastArcStateId = currentId;
}

function doStartFast(offsetH){
  const off=(offsetH||0)*3600000;
  phase='fasting'; fastRunning=true; fastPaused=false;
  fastPauseOffset=off; fastStart=Date.now(); fastElapsedMs=off;
  // lock fast slider, unlock refeed slider
  document.getElementById('fast-slider').disabled=true;
  document.getElementById('refeed-slider').disabled=false;
  manualId=null; document.getElementById('override-sel').value='auto';
  lastArcStateId = null;
  checked.clear();
  saveChecked();
  autoLog('fast_start', { offset_hours: offsetH || 0 });
  startTick(); savePhase(); render();
}
function doStopFast(){
  // transition to refeed — fast stops, refeed not started yet
  fastRunning=false; fastPaused=false; fastStart=null; fastPauseOffset=0; fastElapsedMs=0;
  phase='none';
  document.getElementById('fast-slider').disabled=false;
  autoLog('fast_stop', { duration_h: Math.round(fastElapsedMs / 360000) / 10 });
  applyMealToFast();
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  savePhase(); render();
}
function doPauseFast(){
  if(!fastPaused){
    fastPaused=true;
    fastPauseOffset=fastPauseOffset+(Date.now()-fastStart);
    fastElapsedMs=fastPauseOffset;
    fastStart=null;
    document.getElementById('fast-slider').disabled=false;
  } else {
    fastPaused=false;
    // if slider was moved, use slider position
    const sliderH=getSliderFH();
    fastPauseOffset=sliderH*3600000;
    fastElapsedMs=fastPauseOffset;
    fastStart=Date.now();
    document.getElementById('fast-slider').disabled=true;
  }
  savePhase(); render();
}

// ── refeed controls ───────────────────────────────────────────────────────────
function doStartRefeed(offsetH){
  const off=(offsetH||0)*3600000;
  phase='refeed'; refeedRunning=true; refeedPaused=false;
  refeedPauseOffset=off; refeedStart=Date.now(); refeedElapsedMs=off;
  document.getElementById('refeed-slider').disabled=true;
  document.getElementById('meal-pills').querySelectorAll('.pill').forEach(p=>p.disabled=true);
  document.getElementById('train-pills').querySelectorAll('.pill').forEach(p=>p.disabled=true);
  manualId=null; document.getElementById('override-sel').value='auto';
  lastArcStateId = null;
  checked.clear();
  saveChecked();
  autoLog('refeed_start', { meal_mult: mealMult, train_compress: trainCompress });
  startTick(); savePhase(); render();
}
function doStopRefeed(){
  refeedRunning=false; refeedPaused=false; refeedStart=null; refeedPauseOffset=0; refeedElapsedMs=0;
  phase='none';
  document.getElementById('refeed-slider').disabled=false;
  document.getElementById('meal-pills').querySelectorAll('.pill').forEach(p=>p.disabled=false);
  document.getElementById('train-pills').querySelectorAll('.pill').forEach(p=>p.disabled=false);
  autoLog('refeed_stop', { duration_h: Math.round(refeedElapsedMs / 360000) / 10 });
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  savePhase(); render();
}
function doPauseRefeed(){
  if(!refeedPaused){
    refeedPaused=true;
    refeedPauseOffset=refeedPauseOffset+(Date.now()-refeedStart);
    refeedElapsedMs=refeedPauseOffset;
    refeedStart=null;
    document.getElementById('refeed-slider').disabled=false;
  } else {
    refeedPaused=false;
    const sliderH=getSliderRH();
    refeedPauseOffset=sliderH*3600000;
    refeedElapsedMs=refeedPauseOffset;
    refeedStart=Date.now();
    document.getElementById('refeed-slider').disabled=true;
  }
  savePhase(); render();
}

// ── refeed adjustments ───────────────────────────────────────────────────────
function cancelAdj() {
  mealMult = preAdjMealMult;
  trainCompress = preAdjTrainCompress;
  adjusting = null;
  // restore pill UI to match reverted values
  document.querySelectorAll('#meal-pills .pill').forEach(p=>{
    p.className = 'pill';
    if(parseFloat(p.dataset.val) === mealMult) p.classList.add('on-refeed');
  });
  document.querySelectorAll('#train-pills .pill').forEach(p=>{
    p.className = 'pill';
    if(parseFloat(p.dataset.val) === trainCompress) p.classList.add('on-refeed');
  });
  applyPillGhosts();
  render();
}

function commitAdj() {
  const rh = getRH();
  if (adjusting === 'ate') {
    // extend ready threshold forward from current position
    // light: +1h, normal: +2h, big: +4h
    const addH = mealMult >= 1.8 ? 4 : mealMult >= 1.4 ? 2 : 1;
    const readyState = sr()[sr().length-1];
    const currentReady = getRFT(readyState);
    const newReady = Math.max(currentReady, rh) + addH;
    FT[readyState.id] = Math.round(newReady * 10) / 10;
    // timer keeps running — no reset
    autoLog('ate_again', { meal_mult: mealMult, add_h: addH, new_ready_h: FT[readyState.id] });
  } else if (adjusting === 'trained') {
    // compress remaining window
    const readyState = sr()[sr().length-1];
    const readyH = getRFT(readyState);
    const remaining = Math.max(0, readyH - rh);
    const newReady = rh + remaining * trainCompress;
    FT[readyState.id] = Math.round(newReady * 10) / 10;
    autoLog('trained_during_refeed', { train_compress: trainCompress, new_ready_h: FT[readyState.id] });
  }
  // trail: previous committed becomes ghost, current becomes new committed
  prevCommitMealMult = preAdjMealMult;
  prevCommitTrainCompress = preAdjTrainCompress;
  adjusting = null;
  savePhase();
  render();
}

// ── rebuild override select ───────────────────────────────────────────────────
function rebuildOv(){
  const sel=document.getElementById('override-sel');
  const cur=sel.value;
  sel.innerHTML='<option value="auto">automatic</option>';
  const arr=phase==='refeed'?sr():sf();
  arr.forEach(s=>{ const o=document.createElement('option');o.value=s.id;o.textContent=s.name;sel.appendChild(o); });
  if([...sel.options].find(o=>o.value===cur)) sel.value=cur;
}

// ── render ────────────────────────────────────────────────────────────────────
function render(){
  const fh=displayH(), rh=displayRH();
  const isRefeedPhase=phase==='refeed'||(phase==='none'&&activePreview==='refeed');
  const ov=document.getElementById('override-sel').value;
  let stateId, state, isFast;
  if(isRefeedPhase){
    stateId=ov!=='auto'?ov:(manualId||inferRefeed(rh));
    state=getRById(stateId); isFast=false;
  } else {
    stateId=ov!=='auto'?ov:(manualId||inferFast(fh));
    state=getFById(stateId); isFast=true;
  }
  const zone=getZone(fh);
  const heading=document.getElementById('heading-input').value.trim();

  // sliders
  document.getElementById('fast-slider-val').textContent=Math.floor(fh)+'h';
  document.getElementById('refeed-slider-val').textContent=Math.floor(rh)+'h';
  // sync fast slider to running value
  if(fastRunning&&!fastPaused) document.getElementById('fast-slider').value=Math.min(72,Math.floor(fh));
  if(refeedRunning&&!refeedPaused) document.getElementById('refeed-slider').value=Math.min(24,Math.floor(rh));

  const sh=document.getElementById('slider-hint');
  if(fastRunning&&!fastPaused) sh.textContent='fast running · refeed preview free';
  else if(fastPaused) sh.textContent='fast paused · adjust position then resume';
  else if(refeedRunning&&!refeedPaused) sh.textContent='refeed running · fast preview free';
  else if(refeedPaused) sh.textContent='refeed paused · adjust position then resume';
  else sh.textContent='drag either slider to preview';
  sh.className='slider-hint'+(fastRunning||fastPaused?' a':refeedRunning||refeedPaused?' b':'');

  // ring
  const fill=document.getElementById('ring-fill');
  const el=document.getElementById('ring-elapsed');
  const ringSt=document.getElementById('ring-state');
  const ringNx=document.getElementById('ring-next');
  const badge=document.getElementById('ring-badge');

  function fmtClockMs(startMs, offsetMs) {
    const d = new Date(startMs + offsetMs);
    const h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'pm' : 'am';
    const h12 = h % 12 || 12;
    return h12 + (m > 0 ? ':' + String(m).padStart(2,'0') : '') + ampm;
  }

  function getNextState(currentH, arr, threshFn) {
    const sorted = arr;
    for (const s of sorted) {
      if (threshFn(s) > currentH) return { state: s, inMs: (threshFn(s) - currentH) * 3600000 };
    }
    return null;
  }

  if(phase==='fasting'){
    const c=ZONE_C[zone]||'#888780';
    const prog=Math.min(fh/cycle,1);
    fill.style.strokeDasharray=CIRC; fill.style.strokeDashoffset=CIRC-prog*CIRC; fill.style.stroke=c;
    const elapsed = fastPaused ? fastElapsedMs : fastPauseOffset+(Date.now()-fastStart);
    el.textContent=fmtMs(elapsed);
    ringSt.textContent=state.name;
    const nx=getNextState(fh, sf(), getFT);
    ringNx.textContent=nx?('→ '+nx.state.name+' in '+fmtMs(nx.inMs)):'';
    badge.textContent=fastPaused?'paused':'fasting'; badge.className='ring-badge '+(fastPaused?'b-paused':'b-fast');
  } else if(phase==='refeed'){
    const ready=isReady(rh);
    const last=sr()[sr().length-1]; const maxH=getRFT(last)||6;
    const prog=Math.min(rh/maxH,1);
    fill.style.strokeDasharray=CIRC; fill.style.strokeDashoffset=CIRC-prog*CIRC; fill.style.stroke=ready?'#1d9e75':'#ef9f27';
    const elapsed = refeedPaused ? refeedElapsedMs : refeedPauseOffset+(Date.now()-refeedStart);
    el.textContent=fmtMs(elapsed);
    ringSt.textContent=state.name;
    const nx=getNextState(rh, sr(), getRFT);
    ringNx.textContent=ready?'ready to fast':(nx?('→ '+nx.state.name+' in '+fmtMs(nx.inMs)):'');
    badge.textContent=refeedPaused?'paused':ready?'ready':'refeed';
    badge.className='ring-badge '+(refeedPaused?'b-paused':ready?'b-ready':'b-refeed');
  } else {
    const isR = activePreview==='refeed';
    const ph = isR ? rh : fh;
    if(ph>0){
      const c=isR?'#ef9f27':(ZONE_C[zone]||'#888780');
      const prog=Math.min(ph/(isR?(getRFT(sr()[sr().length-1])||6):cycle),1);
      fill.style.strokeDasharray=CIRC; fill.style.strokeDashoffset=CIRC-prog*CIRC; fill.style.stroke=c;
      el.textContent=Math.floor(ph)+'h';
      ringSt.textContent='preview';
      const nx=isR?getNextState(ph,sr(),getRFT):getNextState(ph,sf(),getFT);
      ringNx.textContent=nx?('→ '+nx.state.name+' in '+fmtMs(nx.inMs)):'';
      badge.textContent=isR?'refeed preview':'fast preview';
      badge.className='ring-badge '+(isR?'b-refeed':'b-fast');
      badge.style.opacity='0.6';
    } else {
      fill.style.strokeDasharray=CIRC; fill.style.strokeDashoffset=CIRC;
      fill.style.stroke='#888780'; el.textContent='—'; ringSt.textContent=''; ringNx.textContent='';
      badge.textContent='idle'; badge.className='ring-badge b-idle'; badge.style.opacity='1';
    }
  }

  // fast button
  const fb=document.getElementById('fast-btn');
  const bh=document.getElementById('btn-hint');
  if(fastRunning&&!fastPaused){ fb.textContent='stop fast'; fb.className='phase-btn fast-run'; fb.onclick=doStopFast; }
  else if(fastPaused){ fb.textContent='resume fast'; fb.className='phase-btn fast-pause'; fb.onclick=doPauseFast; }
  else { fb.textContent='start fast'; fb.className='phase-btn fast-idle'; fb.onclick=()=>doStartFast(getSliderFH()); }

  // refeed button
  const rb=document.getElementById('refeed-btn');
  const cancelAdjBtn=document.getElementById('cancel-adj-btn');
  const rfReady=isReady(rh);
  cancelAdjBtn.style.display = adjusting ? 'block' : 'none';
  cancelAdjBtn.onclick = cancelAdj;
  if(adjusting){
    rb.textContent='update refeed'; rb.className='phase-btn refeed-run'; rb.style.flex='1'; rb.onclick=commitAdj;
  } else if(refeedRunning&&!refeedPaused){
    if(rfReady){ rb.textContent='start fast →'; rb.className='phase-btn ready'; rb.onclick=()=>{doStopRefeed();doStartFast(0);}; }
    else{ rb.textContent='stop refeed'; rb.className='phase-btn refeed-run'; rb.onclick=doStopRefeed; }
  } else if(refeedPaused){ rb.textContent='resume refeed'; rb.className='phase-btn refeed-pause'; rb.onclick=doPauseRefeed; }
  else { rb.textContent='start refeed'; rb.className='phase-btn refeed-idle'; rb.onclick=()=>doStartRefeed(getSliderRH()); }

  // hint
  if(adjusting) bh.textContent='preview update — commit or cancel';
  else if(fastRunning&&!fastPaused) bh.textContent='stop fast to begin refeed';
  else if(fastPaused) bh.textContent='fast paused — resume or stop';
  else if(refeedRunning&&!refeedPaused) bh.textContent=rfReady?'ready — start next fast':'refeed in progress';
  else if(refeedPaused) bh.textContent='refeed paused — resume or stop';
  else bh.textContent='pick a phase to begin';

  // pill labels — lit and unlocked during refeed
  const mealLit = !fastRunning||refeedRunning;
  const trainLit = !fastRunning||refeedRunning;
  document.getElementById('meal-label').className=mealLit?'lit':'';
  document.getElementById('train-label').className=trainLit?'lit':'';
  document.getElementById('meal-pills').querySelectorAll('.pill').forEach(p=>p.disabled=fastRunning&&!refeedRunning);
  document.getElementById('train-pills').querySelectorAll('.pill').forEach(p=>p.disabled=fastRunning&&!refeedRunning);

  netHint();
  document.getElementById('heading-meta').textContent=heading?(isRefeedPhase?'refeed':zone.replace('_',' '))+' · '+state.name:'no heading set';

  // arc
  const arcEl=document.getElementById('arc');
  arcEl.innerHTML='';
  const arcArr=isRefeedPhase?sr():sf();
  const ci=arcArr.findIndex(s=>s.id===stateId);
  const isPreview=isRefeedPhase?!refeedRunning:!fastRunning;

  // clock start for arc
  let arcClockStart = null;
  if(phase==='fasting'&&fastStart) arcClockStart = fastStart - fastPauseOffset;
  else if(phase==='refeed'&&refeedStart) arcClockStart = refeedStart - refeedPauseOffset;

  function arcClockTime(threshH) {
    if(!arcClockStart) return null;
    const ms = arcClockStart + threshH * 3600000;
    const d = new Date(ms);
    const h = d.getHours(), m = d.getMinutes();
    const ampm = h>=12?'pm':'am', h12=h%12||12;
    return h12+(m>0?':'+String(m).padStart(2,'0'):'')+ampm;
  }

  arcArr.forEach((s,i)=>{
    if(i>0){
      const l=document.createElement('div');
      if(isRefeedPhase) l.className='arc-line'+(i<=ci?' rdone':'');
      else l.className='arc-line'+(i<ci?' done':i===ci&&isPreview?' prev':i<=ci?' done':'');
      arcEl.appendChild(l);
    }
    const step=document.createElement('div');step.className='arc-step';
    const dot=document.createElement('div');
    if(isRefeedPhase) dot.className='arc-dot'+(i<ci?' rdone':i===ci?' rcur':'');
    else dot.className='arc-dot'+(i<ci?' done':i===ci?(isPreview?' prev':' cur'):'');
    const lbl=document.createElement('div');
    if(isRefeedPhase) lbl.className='arc-label'+(i<ci?' rdone':i===ci?' rcur':'');
    else lbl.className='arc-label'+(i<ci?' done':i===ci?(isPreview?' prev':' cur'):'');
    const thresh = isRefeedPhase ? getRFT(s) : getFT(s);
    const ct = arcClockTime(thresh);
    lbl.innerHTML = s.name + (ct ? '<br><span style="font-size:8px;opacity:0.6">'+ct+'</span>' : '');
    step.appendChild(dot);step.appendChild(lbl);arcEl.appendChild(step);
  });

  // state block
  const sb=document.getElementById('state-block');
  sb.innerHTML='';
  const nm=document.createElement('div');nm.className='state-name';nm.textContent=state.name;sb.appendChild(nm);
  if(state.desc){const d=document.createElement('div');d.className='state-desc';d.textContent=state.desc;sb.appendChild(d);}
  const arr2=isRefeedPhase?sr():sf();
  const idx=arr2.findIndex(s=>s.id===stateId);
  if(idx>=0&&idx<arr2.length-1){
    const next=arr2[idx+1];
    const thresh=isRefeedPhase?getRFT(next):getFT(next);
    const n=document.createElement('div');n.className='next-hint '+(isRefeedPhase?'next-refeed':'next-fast');
    n.textContent='→ '+next.name+' at '+thresh+'h';
    sb.appendChild(n);
  }

  // compounds
  const area=document.getElementById('compound-area');
  area.innerHTML='';
  if(state.note){
    const note=document.createElement('div');note.className='active-note';note.textContent=state.note;area.appendChild(note);
  } else {
    const list=document.createElement('div');list.className='compound-list';
    (state.compounds||[]).forEach((c,i)=>{
      const id=stateId+'_'+i;
      const row=document.createElement('div');row.className='compound-row';
      const txt=document.createElement('div');txt.className='compound-text';
      const cn=document.createElement('div');cn.className='compound-name';cn.textContent=c.name;
      const cw=document.createElement('div');cw.className='compound-why';cw.textContent=c.why;
      txt.appendChild(cn);txt.appendChild(cw);
      cn.onclick=()=>inlineEdit(cn,'compound-name ed',c,'name',stateId,i,isFast);
      cw.onclick=()=>inlineEdit(cw,'compound-why ed',c,'why',stateId,i,isFast);
      const act=document.createElement('div');act.className='compound-actions';
      const chk=document.createElement('div');chk.className='compound-check'+(checked.has(id)?' done':'');
      chk.dataset.id=id;chk.onclick=()=>{
  const wasDone = checked.has(id);
  wasDone ? checked.delete(id) : checked.add(id);
  autoLog(wasDone ? 'compound_unchecked' : 'compound_taken', {
    compound: c.name,
    why: c.why,
    state: state.name
  });
  saveChecked();render();
};
      const rem=document.createElement('button');rem.className='remove-btn';rem.textContent='×';
      rem.onclick=()=>{const st=isFast?getFById(stateId):getRById(stateId);st.compounds.splice(i,1);save();render();};
      act.appendChild(chk);act.appendChild(rem);row.appendChild(txt);row.appendChild(act);list.appendChild(row);
    });
    const addBtn=document.createElement('button');addBtn.className='add-compound-btn';addBtn.textContent='+ add compound';
    addBtn.onclick=()=>showPicker(stateId,area,addBtn,isFast);
    area.appendChild(list);area.appendChild(addBtn);
  }

  rebuildOv();
  // sync pill active state to current values
  document.querySelectorAll('#meal-pills .pill').forEach(p=>{
    p.classList.remove('on-refeed');
    if(parseFloat(p.dataset.val)===mealMult) p.classList.add('on-refeed');
  });
  document.querySelectorAll('#train-pills .pill').forEach(p=>{
    p.classList.remove('on-refeed');
    if(parseFloat(p.dataset.val)===trainCompress) p.classList.add('on-refeed');
  });
  applyPillGhosts();
}

function inlineEdit(el,cls,c,field,stateId,idx,isFast){
  const inp=document.createElement('input');inp.className=cls;inp.value=c[field];
  el.replaceWith(inp);inp.focus();inp.select();
  const commit=()=>{
    c[field]=inp.value.trim()||c[field];
    const st=isFast?getFById(stateId):getRById(stateId);
    if(st.compounds[idx]) st.compounds[idx][field]=c[field];
    save();render();
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();inp.blur();}if(e.key==='Escape'){inp.value=c[field];inp.blur();}};
}

function getLibrary(){
  const m=new Map();
  [...FS,...RS].forEach(s=>{(s.compounds||[]).forEach(c=>{if(c.name&&!m.has(c.name))m.set(c.name,c.why||'');});});
  return m;
}

function showPicker(stateId,area,addBtn,isFast){
  const ex=area.querySelector('.cpicker');if(ex){ex.remove();return;}
  const lib=getLibrary();
  const pk=document.createElement('div');pk.className='cpicker';
  const sel=document.createElement('select');
  const def=document.createElement('option');def.value='';def.textContent='pick a compound...';sel.appendChild(def);
  lib.forEach((why,name)=>{const o=document.createElement('option');o.value=name;o.dataset.why=why;o.textContent=name;sel.appendChild(o);});
  const no=document.createElement('option');no.value='__new__';no.textContent='+ new compound';sel.appendChild(no);
  pk.appendChild(sel);
  const nf=document.createElement('div');nf.className='cpicker-new';
  const ni=document.createElement('input');ni.type='text';ni.placeholder='compound name';
  const wi=document.createElement('input');wi.type='text';wi.placeholder='mechanism (why)';
  nf.appendChild(ni);nf.appendChild(wi);pk.appendChild(nf);
  sel.onchange=()=>{if(sel.value==='__new__')nf.classList.add('vis');else nf.classList.remove('vis');};
  const ac=document.createElement('div');ac.className='cpicker-actions';
  const ok=document.createElement('button');ok.className='cpicker-ok';ok.textContent='add';
  ok.onclick=()=>{
    const st=isFast?getFById(stateId):getRById(stateId);
    if(sel.value==='__new__'){const n=ni.value.trim();if(!n)return;st.compounds.push({name:n,why:wi.value.trim()});}
    else if(sel.value){const op=sel.options[sel.selectedIndex];st.compounds.push({name:sel.value,why:op.dataset.why||''});}
    else return;
    save();pk.remove();render();
  };
  const no2=document.createElement('button');no2.className='cpicker-no';no2.textContent='cancel';
  no2.onclick=()=>pk.remove();
  ac.appendChild(no2);ac.appendChild(ok);pk.appendChild(ac);
  area.insertBefore(pk,addBtn);sel.focus();
}

// ── settings editor ───────────────────────────────────────────────────────────
function buildSed(listId,arr){
  const list=document.getElementById(listId);list.innerHTML='';
  arr.sort((a,b)=>a.threshold-b.threshold).forEach(state=>{
    const row=document.createElement('div');row.className='sed-row';
    const hdr=document.createElement('div');hdr.className='sed-hdr';
    const ni=document.createElement('input');ni.className='sed-name';ni.value=state.name;ni.oninput=()=>{state.name=ni.value;};
    const ti=document.createElement('input');ti.className='sed-thresh';ti.type='number';ti.min=0;ti.max=72;ti.value=state.threshold;ti.oninput=()=>{state.threshold=parseFloat(ti.value)||0;};
    const tu=document.createElement('span');tu.className='sed-unit';tu.textContent='h';
    const rem=document.createElement('button');rem.className='sed-rem';rem.textContent='×';
    rem.onclick=()=>{if(arr===FS)FS=FS.filter(s=>s.id!==state.id);else RS=RS.filter(s=>s.id!==state.id);buildSed(listId,arr);};
    hdr.appendChild(ni);hdr.appendChild(ti);hdr.appendChild(tu);hdr.appendChild(rem);
    const di=document.createElement('textarea');di.className='sed-desc';di.value=state.desc||'';di.rows=2;di.oninput=()=>{state.desc=di.value;};
    const cl=document.createElement('div');cl.className='sed-clbl';cl.textContent='compounds';
    const clist=document.createElement('div');
    const rebC=()=>{
      clist.innerHTML='';
      (state.compounds||[]).forEach((c,ci)=>{
        const cr=document.createElement('div');cr.className='sed-crow';
        const cn=document.createElement('input');cn.className='sed-cn';cn.value=c.name;cn.placeholder='name';cn.oninput=()=>{c.name=cn.value;};
        const cw=document.createElement('input');cw.className='sed-cw';cw.value=c.why;cw.placeholder='mechanism';cw.oninput=()=>{c.why=cw.value;};
        const cr2=document.createElement('button');cr2.className='sed-crem';cr2.textContent='×';cr2.onclick=()=>{state.compounds.splice(ci,1);rebC();};
        cr.appendChild(cn);cr.appendChild(cw);cr.appendChild(cr2);clist.appendChild(cr);
      });
      const ca=document.createElement('button');ca.className='sed-cadd';ca.textContent='+ add compound';ca.onclick=()=>{state.compounds.push({name:'',why:''});rebC();};
      clist.appendChild(ca);
    };
    rebC();
    row.appendChild(hdr);row.appendChild(di);row.appendChild(cl);row.appendChild(clist);
    list.appendChild(row);
  });
}



// ── pill handlers ─────────────────────────────────────────────────────────────
function applyPillGhosts() {
  // only show ghost if prev commit differs from current value
  document.querySelectorAll('#meal-pills .pill').forEach(p=>{
    const v = parseFloat(p.dataset.val);
    p.classList.remove('ghost');
    if(prevCommitMealMult !== null && prevCommitMealMult !== mealMult && v === prevCommitMealMult)
      p.classList.add('ghost');
  });
  document.querySelectorAll('#train-pills .pill').forEach(p=>{
    const v = parseFloat(p.dataset.val);
    p.classList.remove('ghost');
    if(prevCommitTrainCompress !== null && prevCommitTrainCompress !== trainCompress && v === prevCommitTrainCompress)
      p.classList.add('ghost');
  });
}

document.querySelectorAll('#meal-pills .pill').forEach(b=>{
  b.onclick=function(){
    if(this.disabled) return;
    if(refeedRunning&&!refeedPaused&&!adjusting){
      preAdjMealMult=mealMult; preAdjTrainCompress=trainCompress;
    }
    document.querySelectorAll('#meal-pills .pill').forEach(x=>{x.className='pill';});
    this.classList.add('on-refeed');
    mealMult=parseFloat(this.dataset.val);
    if(refeedRunning&&!refeedPaused) adjusting='ate';
    applyPillGhosts(); netHint(); render();
  };
});
document.querySelectorAll('#train-pills .pill').forEach(b=>{
  b.onclick=function(){
    if(this.disabled) return;
    if(refeedRunning&&!refeedPaused&&!adjusting){
      preAdjMealMult=mealMult; preAdjTrainCompress=trainCompress;
    }
    document.querySelectorAll('#train-pills .pill').forEach(x=>{x.className='pill';});
    this.classList.add('on-refeed');
    trainCompress=parseFloat(this.dataset.val);
    if(refeedRunning&&!refeedPaused) adjusting='trained';
    netHint(); render();
  };
});

// ── gear / settings ───────────────────────────────────────────────────────────
document.getElementById('gear-btn').onclick=()=>{
  buildSed('fast-sed',FS); buildSed('refeed-sed',RS);
  document.getElementById('t-cycle').value=cycle;
  document.getElementById('overlay').classList.add('open');
};
document.getElementById('add-fast-state').onclick=()=>{FS.push({id:'fs_'+Date.now(),name:'new state',threshold:48,desc:'',compounds:[]});buildSed('fast-sed',FS);};
document.getElementById('add-refeed-state').onclick=()=>{RS.push({id:'rf_'+Date.now(),name:'new state',threshold:8,desc:'',compounds:[]});buildSed('refeed-sed',RS);};
document.getElementById('pcancel').onclick=()=>{load();document.getElementById('overlay').classList.remove('open');};
document.getElementById('psave').onclick=()=>{
  cycle=parseInt(document.getElementById('t-cycle').value)||24;
  save();rebuildOv();document.getElementById('overlay').classList.remove('open');render();
};
document.getElementById('preset-link').onclick=()=>{ if(confirm('reset all data?')){ try{localStorage.clear();}catch(e){} location.reload(); } };
document.getElementById('override-sel').onchange=function(){manualId=this.value==='auto'?null:this.value;render();};
document.getElementById('fast-slider').oninput=()=>{activePreview='fast';manualId=null;render();};
document.getElementById('refeed-slider').oninput=()=>{activePreview='refeed';manualId=null;render();};

document.getElementById('intention-sel').onchange=render;
document.getElementById('elec-sel').onchange=render;
document.getElementById('heading-input').oninput=render;

// ── snapshot ──────────────────────────────────────────────────────────────────
document.getElementById('snapshot-btn').onclick=function(){
  const btn=this; btn.textContent='demo mode — no sync'; btn.classList.add('sent');
  setTimeout(()=>{btn.textContent='snapshot ↓';btn.classList.remove('sent');},2000);
};

// ── anchor ───────────────────────────────────────────────────────────────────
function fmtMins(totalMins) {
  const h = Math.floor(((totalMins % 1440) + 1440) % 1440 / 60);
  const m = ((totalMins % 1440) + 1440) % 1440 % 60;
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = h % 12 || 12;
  return h12 + (m > 0 ? ':' + String(m).padStart(2,'0') : '') + ampm;
}

function buildAnchorSelect() {
  const sel = document.getElementById('anchor-state-sel');
  const cur = sel.value;
  sel.innerHTML = '';
  sf().forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.textContent = s.name; sel.appendChild(o);
  });
  if ([...sel.options].find(o => o.value === cur)) sel.value = cur;
  else if (sel.options.length) sel.value = sel.options[0].value;
}

function renderAnchor() {
  const sel = document.getElementById('anchor-state-sel');
  const anchorMins = parseInt(document.getElementById('anchor-slider').value);
  document.getElementById('anchor-time-label').textContent = fmtMins(anchorMins);

  const anchorStateId = sel.value;
  const anchorState = getFById(anchorStateId);
  const anchorThresh = anchorState ? getFT(anchorState) : 0;

  // fast start = anchor_time - anchor_threshold (in minutes)
  const fastStartMins = anchorMins - anchorThresh * 60;

  const tl = document.getElementById('anchor-timeline');
  tl.innerHTML = '';

  // last meal row
  const lmRow = document.createElement('div');
  lmRow.className = 'tl-row meal-row';
  lmRow.innerHTML = `<span class="tl-time">${fmtMins(fastStartMins)}</span><span class="tl-name">last meal / start fast</span>`;
  tl.appendChild(lmRow);

  // each fast state
  sf().forEach(s => {
    const stateMins = fastStartMins + getFT(s) * 60;
    const row = document.createElement('div');
    row.className = 'tl-row' + (s.id === anchorStateId ? ' anchor-row-hl' : '');
    row.innerHTML = `<span class="tl-time">${fmtMins(stateMins)}</span><span class="tl-name">${s.name}${s.id === anchorStateId ? ' ←' : ''}</span>`;
    tl.appendChild(row);
  });

  // refeed window
  const lastFast = sf()[sf().length - 1];
  const fastEndMins = fastStartMins + getFT(lastFast) * 60;
  const refeedReadyState = sr()[sr().length - 1];
  const refeedReadyH = getRFT(refeedReadyState);
  const readyMins = fastStartMins + 24 * 60 + refeedReadyH * 60; // next day cycle

  const rfRow = document.createElement('div');
  rfRow.className = 'tl-row';
  rfRow.innerHTML = `<span class="tl-time" style="color:#ef9f27">${fmtMins(fastStartMins + 24*60)}</span><span class="tl-name" style="color:#ef9f27">eat (next cycle)</span>`;
  tl.appendChild(rfRow);

  const rdRow = document.createElement('div');
  rdRow.className = 'tl-row';
  rdRow.innerHTML = `<span class="tl-time" style="color:#5dcaa5">${fmtMins(fastStartMins + 24*60 + refeedReadyH*60)}</span><span class="tl-name" style="color:#5dcaa5">ready to fast again</span>`;
  tl.appendChild(rdRow);
}



// ── clock ─────────────────────────────────────────────────────────────────────
function tick(){const n=new Date();const t=n.getHours()+':'+String(n.getMinutes()).padStart(2,'0');document.getElementById('clock').textContent=t;}

// ── init ──────────────────────────────────────────────────────────────────────
tick();setInterval(tick,30000);

// async init — load from daemon then start
(async () => {
  await load();
  const hasPhase = await loadPhase();
  if(!hasPhase){
    document.getElementById('main-screen').style.display='block';
  } else {
    document.getElementById('main-screen').style.display='block';
    if(fastRunning&&!fastPaused||refeedRunning&&!refeedPaused) startTick();
    if(fastRunning&&!fastPaused) autoLog('fast_resume', { hours: Math.round(getFH()*10)/10 });
    if(refeedRunning&&!refeedPaused) autoLog('refeed_resume', { hours: Math.round(getRH()*10)/10, meal_mult: mealMult });
    const fh0=getFH(), rh0=getRH();
    lastArcStateId = phase==='refeed' ? inferRefeed(rh0) : inferFast(fh0);
    render();
  }
})();
</script>
