<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Garment Construction — v1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0b;width:100vw;height:100vh;overflow:hidden;font-family:"DM Mono",monospace;color:#e4e4e7}
  #app{width:100vw;height:100vh;display:flex;flex-direction:column}
  .panels{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
  .panels.single-a{grid-template-columns:1fr}
  .panels.single-a .panel.rings{display:none}
  .panels.single-a ~ #ui3{display:none}
  .panels.single-b{grid-template-columns:1fr}
  .panels.single-b .panel.ray{display:none}
  .panels.single-b ~ #ui{display:none}
  .panels.single-b ~ #ui2{display:none}

  @media(max-width:600px){
    /* Force single-panel on mobile — hide both button */
    #btn-both{ display:none }
    /* ui3 controls move to bottom, full width, scrollable */
    #ui3{
      top:auto !important; bottom:0; right:0; left:0;
      border-radius:0; border-top:1px solid #1c1c20;
      border-bottom-left-radius:0 !important;
      flex-direction:row; flex-wrap:wrap; gap:4px;
      padding:6px 10px; min-width:0;
      max-height:38vh; overflow-y:auto;
    }
    /* Tighten methodBar */
    #methodBar{ padding:4px 8px; gap:4px }
    /* Replay buttons at bottom center */
    #ui2{ bottom:50px !important }
    .panel.ray button[onclick="replayMethodA()"]{ bottom:50px !important }
    /* Panel headers smaller */
    .panel-title{ font-size:9px !important }
    /* ui3 tree sections lay flat */
    .tree-section{ flex:1; min-width:120px }
  }
  .panel{position:relative;border-right:1px solid #1c1c20}
  .panel:last-child{border-right:none}
  canvas{display:block;width:100%!important;height:100%!important}
  .panel-header{position:absolute;top:12px;left:16px;z-index:10;display:flex;align-items:center;gap:8px;pointer-events:none}
  .tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border:1px solid}
  .panel-title{font-family:"Syne",sans-serif;font-size:11px;font-weight:600;letter-spacing:.04em}
  .panel.ray .tag{border-color:#f59e0b;color:#f59e0b}
  .panel.rings .tag{border-color:#22d3ee;color:#22d3ee}
  #ui{position:fixed;bottom:20px;left:25%;transform:translateX(-50%);display:flex;gap:8px;z-index:200}
  #ui2{position:fixed;bottom:20px;left:75%;transform:translateX(-50%);display:flex;gap:8px;z-index:200}
  button{background:#1a1a1a;border:1px solid #333;color:#888;font:10px "DM Mono",monospace;letter-spacing:.08em;padding:6px 12px;cursor:pointer;text-transform:uppercase;transition:all .15s}
  button:hover{border-color:#fff;color:#fff}
  button.active{border-color:#22d3ee;color:#22d3ee}
</style>
</head>
<body>
<div id="app">
  <div id="methodBar" style="display:flex;align-items:center;gap:6px;padding:6px 10px;background:#0a0a0a;border-bottom:1px solid #1c1c20;z-index:30">
    <button onclick="setMethod('both')" id="btn-both" style="font:8px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid #333;background:transparent;color:#888;cursor:pointer">both</button>
    <button onclick="setMethod('a')" id="btn-a" style="font:8px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid #f59e0b;background:transparent;color:#f59e0b;cursor:pointer">method a</button>
    <button onclick="setMethod('b')" id="btn-b" style="font:8px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid #22d3ee;background:transparent;color:#22d3ee;cursor:pointer">method b</button>
  </div>
  <div class="panels">
    <div class="panel ray">
      <div class="panel-header">
        <span class="tag">method A</span>
        <span class="panel-title">Ray SOP — Panel Projection</span>
      </div>
      <button onclick="replayMethodA()" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;background:#1a1a1a;border:1px solid #333;color:#888;font:10px 'DM Mono',monospace;letter-spacing:.08em;padding:6px 12px;cursor:pointer;text-transform:uppercase">&#9654; replay</button>
      <!-- Method A: limitation caption -->
      <div id="methodACaption" style="position:absolute;bottom:60px;left:12px;z-index:50;pointer-events:none;
        font:7px 'DM Mono',monospace;color:#555;letter-spacing:.08em;line-height:1.8;
        border-left:2px solid #2a2a2a;padding-left:8px;transition:opacity 0.4s">
        no body awareness —<br>coordinates in world space<br>body change = manual rework
      </div>
      <canvas id="canvasRay"></canvas>
    </div>
    <div class="panel rings">
      <div id="landmarkPanel" style="
        position:absolute; left:12px; top:50%; transform:translateY(-50%);
        z-index:200; pointer-events:none; opacity:0; transition:opacity 0.3s;
        display:flex; flex-direction:column; gap:0;
      ">
        <div style="font:8px 'DM Mono',monospace;color:#aaa;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;border-bottom:1px solid #333;padding-bottom:6px">place landmarks</div>
        <div id="landmarkList" style="display:flex;flex-direction:column;gap:6px"></div>
      </div>
      <!-- SVG overlay for drag trail lines -->
      <svg id="dragTrails" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:199" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="panel-header">
        <span class="tag">method B</span>
        <span class="panel-title">Geodesic Regions — Body Encoding · v1</span>
      </div>
      <canvas id="canvasRings"></canvas>
    </div>
  </div>
</div>

<div id="ui2">
  <button onclick="replayReveal()">&#9654; replay</button>
</div>
<style>
.tree-section { margin-bottom:1px; }
.tree-header {
  display:flex; align-items:center; gap:4px; cursor:pointer;
  font:8px 'DM Mono',monospace; color:#ccc; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 0; user-select:none;
}
.tree-header:hover { color:#fff; }
.tree-arrow { font-size:7px; color:#888; transition:transform .15s; display:inline-block; }
.tree-arrow.open { transform:rotate(90deg); }
.tree-body { overflow:hidden; }
.tree-body.collapsed { display:none; }
.ui-label {
  font:9px 'DM Mono',monospace; color:#ccc;
  display:flex; justify-content:space-between; gap:6px; align-items:center;
  padding:1px 0;
}
</style>
<div id="ui3" style="position:fixed;top:0;right:0;padding:6px 10px;display:flex;flex-direction:column;gap:0;z-index:100;background:rgba(0,0,0,0.65);border-bottom-left-radius:8px;min-width:150px">

  <!-- GARMENT (top level, open) -->
  <div class="tree-section">
    <div class="tree-header" onclick="toggleTree('garment')">
      <span class="tree-arrow open" id="arrow-garment">&#9654;</span>garment
    </div>
    <div class="tree-body" id="tree-garment">
      <label class="ui-label">resolution
        <input id="sliderRes" type="range" min="1" max="5" step="1" value="1" style="width:70px">
      </label>

      <!-- LENGTH nested under garment, collapsed -->
      <div class="tree-section" style="padding-left:8px">
        <div class="tree-header" onclick="toggleTree('length')">
          <span class="tree-arrow" id="arrow-length">&#9654;</span>length
        </div>
        <div class="tree-body collapsed" id="tree-length">
          <label class="ui-label">collar
            <input id="sliderCollar" type="range" min="0" max="1" step="0.01" value="0" style="width:70px">
          </label>
          <label class="ui-label">sleeve
            <input id="sliderSleeve" type="range" min="0" max="1" step="0.01" value="0" style="width:70px">
          </label>
          <label class="ui-label">body
            <input id="sliderHem" type="range" min="0" max="1" step="0.01" value="0" style="width:70px">
          </label>
        </div>
      </div>

      <!-- SIZE nested under garment, collapsed -->
      <div class="tree-section" style="padding-left:8px">
        <div class="tree-header" onclick="toggleTree('size')">
          <span class="tree-arrow" id="arrow-size">&#9654;</span>size
        </div>
        <div class="tree-body collapsed" id="tree-size">
          <label class="ui-label">neck
            <input class="ringSlider" data-idx="5" type="range" min="1.0" max="2.0" step="0.01" value="1" style="width:70px">
          </label>
          <label class="ui-label">shoulder
            <input class="ringSlider" data-idx="0" type="range" min="1.0" max="2.0" step="0.01" value="1" style="width:70px">
          </label>
          <label class="ui-label">elbow
            <input class="ringSlider" data-idx="14" type="range" min="1.0" max="2.0" step="0.01" value="1" style="width:70px">
          </label>
          <label class="ui-label">bust
            <input id="sliderCageOffset" type="range" min="0.001" max="0.008" step="0.0005" value="0.001" style="width:70px">
          </label>
          <label class="ui-label">waist
            <input class="ringSlider" data-idx="6" type="range" min="1.0" max="2.0" step="0.01" value="1" style="width:70px">
          </label>
          <label class="ui-label">hem
            <input class="ringSlider" data-idx="7" type="range" min="1.0" max="2.0" step="0.01" value="1" style="width:70px">
          </label>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
function toggleTree(id) {
  const body = document.getElementById('tree-' + id);
  const arrow = document.getElementById('arrow-' + id);
  const collapsed = body.classList.toggle('collapsed');
  arrow.classList.toggle('open', !collapsed);
}
</script>

const PALETTE = [

  0xe9c46a, 0x6a4c93, 0x22d3ee, 0xf59e0b,

// ── Undo stack ────────────────────────────────────────────────────────────
const undoStack = [];   // each entry: {poles, seeds} snapshots
const MAX_UNDO = 40;

function pushUndo() {
  undoStack.push({
    poles: poles.map(s => ({...s})),
    seeds: SEEDS.map(s => ({...s}))
  });
  if(undoStack.length > MAX_UNDO) undoStack.shift();
}

function applyUndo() {
  if(!undoStack.length) return;
  const snapshot = undoStack.pop();

  // Restore poles
  poleDots.forEach(d => ringsS.bodyGroup.remove(d));
  poles.length = 0; poleDots.length = 0;
  snapshot.poles.forEach(s => {
    const col = new THREE.Color(PALETTE[poles.length % PALETTE.length]);
    const dot = makePoleDotMesh(col, s.mirrorOf !== null);
    dot.position.set(s.x, s.y, s.z);
    ringsS.bodyGroup.add(dot);
    poles.push(s);
    poleDots.push(dot);
  });

  // Restore all seeds
  if(snapshot.seeds) {
    seedDots.forEach(d => ringsS.bodyGroup.remove(d));
    seedDots.length = 0;
    SEEDS.length = 0;
    snapshot.seeds.forEach(s => SEEDS.push({...s}));
    initSeeds();
    const _pc = document.getElementById('poleCount'); if(_pc) _pc.textContent =
      SEEDS.filter(s => s.mirrorOf === null).length + ' landmarks';
  }

  hideGizmo();
  selectedPole = -1; selectedSeedIdx = -1;
  colorMeshByLandmarks();
  poleCageGroup.children.slice().forEach(c => poleCageGroup.remove(c));
  computePoles(); _drawPolesAndCage();
}

// ── Scene factory ──────────────────────────────────────────────────────────
function makeScene(canvasId) {
  const canvas = document.getElementById(canvasId);
  const wrap = canvas.parentElement;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const renderer = new THREE.WebGLRenderer({antialias:true, canvas});
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(w, h);
  renderer.setClearColor(0x0a0a0b);

  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(42, w/h, 0.01, 100);
  cam.position.set(-0.45, 0.75, 0.85);
  cam.lookAt(0, 0.45, 0);

  const controls = new OrbitControls(cam, canvas);
  controls.target.set(0, 0.45, 0);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.update();

  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const dl1 = new THREE.DirectionalLight(0xffffff, 0.9);
  dl1.position.set(-1, 2, 2); scene.add(dl1);
  const dl2 = new THREE.DirectionalLight(0x8888ff, 0.25);
  dl2.position.set(2, 0, -1); scene.add(dl2);

  const bodyGroup = new THREE.Group();
  bodyGroup.rotation.y = -Math.PI * 0.38;
  scene.add(bodyGroup);

  const bGeo = new THREE.BufferGeometry();
  bGeo.setAttribute('position', new THREE.Float32BufferAttribute(V, 3));
  bGeo.setIndex(F);
  bGeo.computeVertexNormals();

  const cGeo = new THREE.BufferGeometry();
  cGeo.setAttribute('position', new THREE.Float32BufferAttribute(CV, 3));
  cGeo.setIndex(CF);
  cGeo.computeVertexNormals();
  const castMesh = new THREE.Mesh(cGeo, new THREE.MeshBasicMaterial({visible:false, side:THREE.DoubleSide}));
  bodyGroup.add(castMesh);

  // Visible body mesh
  const visGeo = new THREE.BufferGeometry();
  visGeo.setAttribute('position', new THREE.Float32BufferAttribute(V, 3));
  visGeo.setIndex(F);
  visGeo.computeVertexNormals();
  const visMesh = new THREE.Mesh(visGeo, new THREE.MeshStandardMaterial({color:0x888899, roughness:0.7, metalness:0.1}));
  bodyGroup.add(visMesh);

  window.addEventListener('resize', () => {
    const nw=wrap.clientWidth, nh=wrap.clientHeight;
    renderer.setSize(nw,nh); cam.aspect=nw/nh; cam.updateProjectionMatrix();
  });

  return {renderer, scene, cam, controls, bodyGroup, castMesh, bGeo};
}

// ── Contour ring: cast rays inward from outside, hit the surface ──────────
// perfectCircle: if true, use the median hit radius for ALL points (ignores surface variance)
// radiusScale: multiply the measured radius by this factor (default 1.0)
function buildContourRing(fanOrigin, ringAxis, castDist, xClamp, perfectCircle, radiusScale) {
  const scale = radiusScale || 1.0;
  const scaledCastDist = castDist * Math.max(scale, 1.0); // always at least original castDist
  const SEGS = 48;
  const axN = ringAxis.clone().normalize();
  const tmp = Math.abs(axN.y) < 0.9 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0);
  const u = new THREE.Vector3().crossVectors(tmp, axN).normalize();
  const v = new THREE.Vector3().crossVectors(axN, u).normalize();

  const rc = new THREE.Raycaster();
  rc.params = { Mesh: {} };
  const invMat = new THREE.Matrix4().copy(ringsS.bodyGroup.matrixWorld).invert();

  // First pass: collect raw hit distances
  const rawDists = [], rawPts = [], dirs = [];
  for(let i = 0; i < SEGS; i++) {
    const a = (i / SEGS) * Math.PI * 2;
    const dir = new THREE.Vector3(
      u.x * Math.cos(a) + v.x * Math.sin(a),
      u.y * Math.cos(a) + v.y * Math.sin(a),
      u.z * Math.cos(a) + v.z * Math.sin(a)
    ).normalize();
    dirs.push(dir);

    let startLocal = fanOrigin.clone().addScaledVector(dir, scaledCastDist);
    if(xClamp > 0 && startLocal.x < 0.001) startLocal.x = 0.001;
    if(xClamp < 0 && startLocal.x > -0.001) startLocal.x = -0.001;
    const inwardDir = fanOrigin.clone().sub(startLocal).normalize();

    const startWorld = startLocal.clone().applyMatrix4(ringsS.bodyGroup.matrixWorld);
    const dirWorld   = inwardDir.clone().transformDirection(ringsS.bodyGroup.matrixWorld).normalize();
    rc.set(startWorld, dirWorld);
    rc.far = scaledCastDist * 2.5;

    const hits = rc.intersectObject(ringsS.castMesh, false);
    if(hits.length > 0) {
      const p = hits[0].point.clone().applyMatrix4(invMat);
      rawPts.push(p);
      rawDists.push(p.distanceTo(fanOrigin));
    } else {
      rawPts.push(null);
      rawDists.push(null);
    }
  }

  // Compute median valid distance — use as perfect-circle radius or outlier clamp
  const validDists = rawDists.filter(d => d !== null).sort((a,b) => a-b);
  const medianDist = (validDists.length ? validDists[Math.floor(validDists.length/2)] : scaledCastDist*0.7) * scale;
  const maxAllowed = medianDist * 1.15;

  // Second pass: perfect circle uses median for every point; surface mode clamps outliers
  const pts = [];
  for(let i = 0; i < SEGS; i++) {
    let pt;
    if(perfectCircle) {
      pt = fanOrigin.clone().addScaledVector(dirs[i], medianDist);
    } else if(rawPts[i] !== null && rawDists[i] <= maxAllowed) {
      pt = rawPts[i];
    } else {
      pt = fanOrigin.clone().addScaledVector(dirs[i], medianDist);
    }
    // Scale point outward from fanOrigin by scale factor
    if(scale !== 1.0) {
      const offset = pt.clone().sub(fanOrigin);
      pt = fanOrigin.clone().addScaledVector(offset, scale);
    }
    pts.push(pt);
  }

  if(pts.length > 0) pts.push(pts[0].clone());
  return pts;
}

const NO_RING_BAKED = new Set([2, 3, 10, 11, 12, 13]) // seed 4 restored: above-underbust ring inside cage; // head, cage interior, feet, hands

function getRingParams(seedPos, seedIdx) {
  if(seedIdx !== undefined && seedIdx < BAKED_SEEDS.length && NO_RING_BAKED.has(seedIdx)) {
    return null;
  }

  const ax = Math.abs(seedPos.x);
  const ay = seedPos.y;
  const sx = seedPos.x >= 0 ? 1 : -1;

  // ── Arms (elbow/wrist): very wide lateral offset, above hip
  if(ax > 0.20 && ay > 0.45) {
    return {
      ringAxis:    new THREE.Vector3(1, 0, 0),
      fanOrigin:   new THREE.Vector3(seedPos.x, seedPos.y, seedPos.z),
      castDist:    0.09,
      xClamp:      null,
      perfectCircle: true
    };
  }

  // ── Shoulder: any lateral offset above hip — X-axis ring wraps around the arm/shoulder tube
  if(ax > 0.03 && ay > 0.45) {
    return {
      ringAxis:    new THREE.Vector3(1, 0, 0),
      fanOrigin:   new THREE.Vector3(seedPos.x, seedPos.y, seedPos.z),
      castDist:    0.11,
      xClamp:      null,
      perfectCircle: true
    };
  }

  // ── Legs / feet: offset but below hip
  if(ax > 0.02 && ay < 0.50) {
    return {
      ringAxis:      new THREE.Vector3(0, 1, 0),
      fanOrigin:     new THREE.Vector3(seedPos.x, seedPos.y, seedPos.z),
      castDist:      0.065,
      xClamp:        sx,
      perfectCircle: true
    };
  }

  // ── Torso / neck / head: on or near centerline
  return {
    ringAxis:  new THREE.Vector3(0, 1, 0),
    fanOrigin: new THREE.Vector3(0, seedPos.y, 0),
    castDist:  0.22,
    xClamp:    null
  };
}

// Build a ring Group: contour ring that wraps the body surface + center dot + hit zone
function makeSeedRingMesh(col, isMirror, seedPos, seedIdx) {
  const group = new THREE.Group();
  const ringCol = new THREE.Color(isMirror ? col.clone().multiplyScalar(0.65) : col);

  const params = getRingParams(seedPos, seedIdx);
  if(params !== null) {
    const { ringAxis, fanOrigin, castDist, xClamp, perfectCircle } = params;
    const pts = buildContourRing(fanOrigin, ringAxis, castDist, xClamp, perfectCircle, getRingScale(seedIdx));
    // Store ring points for use by cage subdivision
    group.userData.ringPts = pts;
    group.userData.ringOrigin = fanOrigin.clone();
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: ringCol, depthTest: false, depthWrite: false, transparent: true, opacity: 0.85
    }));
    line.renderOrder = 998;
    group.add(line);
  }

  // Tiny center dot at the seed position
  const centerDot = new THREE.Mesh(
    new THREE.SphereGeometry(0.003, 6, 6),
    new THREE.MeshBasicMaterial({ color: ringCol, depthTest: false, depthWrite: false })
  );
  centerDot.position.copy(seedPos);
  centerDot.renderOrder = 999;
  group.add(centerDot);

  // Invisible hit zone at the seed position
  const hitZone = new THREE.Mesh(
    new THREE.SphereGeometry(0.022, 8, 8),
    new THREE.MeshBasicMaterial({visible: false})

  hitZone.position.copy(seedPos);
  hitZone.userData.isSeedHitZone = true;
  group.add(hitZone);

  return group;
}

      const dx=s.x-vx, dy=s.y-vy, dz=s.z-vz;
      const d=dx*dx+dy*dy+dz*dz;
      if(d<bestD){bestD=d;best=si;}
    });
    const col = new THREE.Color(PALETTE[best % PALETTE.length]);
    vertColors[i*3]   = col.r * 0.6 + 0.1;
    vertColors[i*3+1] = col.g * 0.6 + 0.1;
    vertColors[i*3+2] = col.b * 0.6 + 0.1;
  }
  ringsBGeo.attributes.color.needsUpdate = true;
}

function makePoleDotMesh(col, isMirror) {

function addPoleDot(rawPos) {
  pushUndo();  // snapshot before placing
  const snapped = rawPos.clone();
  if(Math.abs(snapped.x) < SNAP_THRESHOLD) snapped.x = 0;

  const primaryIdx = SEEDS.length;
  const col = new THREE.Color(PALETTE[primaryIdx % PALETTE.length]);

  // Primary — goes straight into SEEDS + seedDots
  const dot = makeSeedDotMesh(col, false, snapped, primaryIdx);
  ringsS.bodyGroup.add(dot);
  seedDots.push(dot);
  SEEDS.push({x:snapped.x, y:snapped.y, z:snapped.z, mirrorOf:null});

  // Mirror — only if off-center
  if(Math.abs(snapped.x) >= SNAP_THRESHOLD) {
    const mirrorPos = new THREE.Vector3(-snapped.x, snapped.y, snapped.z);
    const mirrorIdx = primaryIdx + 1;
    const mirrorDot = makeSeedDotMesh(col, true, mirrorPos, mirrorIdx);
    ringsS.bodyGroup.add(mirrorDot);
    seedDots.push(mirrorDot);
    SEEDS.push({x:mirrorPos.x, y:mirrorPos.y, z:mirrorPos.z, mirrorOf:primaryIdx});
  }

  const _pc = document.getElementById('poleCount'); if(_pc) _pc.textContent =
    SEEDS.filter(s => s.mirrorOf === null).length + ' landmarks';

  colorMeshByLandmarks();
  poleCageGroup.children.slice().forEach(c => poleCageGroup.remove(c));
  computePoles(); _drawPolesAndCage();
  return primaryIdx;
}

// Project ray onto axis line for dragging
function rayOnAxis(e, seedPos, axis) {
  const canvas = document.getElementById('canvasRings');
  const rect = canvas.getBoundingClientRect();
  mousePt.set(
    ((e.clientX-rect.left)/rect.width)*2-1,
    -((e.clientY-rect.top)/rect.height)*2+1
  );
  rcRings.setFromCamera(mousePt, ringsS.cam);
  // Axis in world space
  const axDir = AXIS_DIRS[axis].clone().transformDirection(ringsS.bodyGroup.matrixWorld).normalize();
  const seedWorld = seedPos.clone().applyMatrix4(ringsS.bodyGroup.matrixWorld);
  // Find closest point on axis line to ray
  const ro = rcRings.ray.origin, rd = rcRings.ray.direction;
  const ao = seedWorld, ad = axDir;
  const w = ro.clone().sub(ao);
  const b = rd.dot(ad);
  const e2 = rd.dot(rd);
  const c = ad.dot(ad);
  const d = rd.dot(w);
  const f = ad.dot(w);
  const denom = e2*c - b*b;
  if(Math.abs(denom) < 1e-6) return null;
  const t = (b*d - e2*f) / denom;
  return t; // scalar along axis
}

// ── Init baked seeds ─────────────────────────────────────────────────────
// ── Poles: procedurally computed Voronoi convergence points ───────────────
// A convergence point is where 3+ region borders meet — i.e. a mesh triangle
// whose 3 vertices each belong to a different Voronoi region.
// We cluster nearby convergence face centroids to get one pole per junction.

let POLES = []; // computed after mesh is ready

function computePoles() {
  const pos  = ringsBGeo.attributes.position.array;
  const idx  = ringsBGeo.index.array;
  const nV   = pos.length / 3;
  const nF   = idx.length / 3;

  // Assign each vertex to nearest SEED region
  const vertRegion = new Int32Array(nV);
  for(let i=0; i<nV; i++) {
    const vx=pos[i*3], vy=pos[i*3+1], vz=pos[i*3+2];
    let best=0, bestD=Infinity;
    SEEDS.forEach((s,si) => {
      const dx=s.x-vx, dy=s.y-vy, dz=s.z-vz;
      const d=dx*dx+dy*dy+dz*dz;
      if(d<bestD){bestD=d;best=si;}
    });
    vertRegion[i]=best;
  }

  // Collect face centroids where all 3 verts are in different regions
  const rawPts = [];
  for(let f=0; f<nF; f++) {
    const a=idx[f*3], b=idx[f*3+1], c=idx[f*3+2];
    const ra=vertRegion[a], rb=vertRegion[b], rc=vertRegion[c];
    if(ra!==rb && rb!==rc && ra!==rc) {
      rawPts.push({
        x:(pos[a*3]+pos[b*3]+pos[c*3])/3,
        y:(pos[a*3+1]+pos[b*3+1]+pos[c*3+1])/3,
        z:(pos[a*3+2]+pos[b*3+2]+pos[c*3+2])/3
      });
    }
  }

  // Cluster nearby points (merge within radius 0.02) → one pole per junction
  const MERGE_R2 = 0.02 * 0.02;
  const clusters = [];
  rawPts.forEach(p => {
    let merged = false;
    for(const cl of clusters) {
      const dx=cl.sx/cl.n-p.x, dy=cl.sy/cl.n-p.y, dz=cl.sz/cl.n-p.z;
      if(dx*dx+dy*dy+dz*dz < MERGE_R2) {
        cl.sx+=p.x; cl.sy+=p.y; cl.sz+=p.z; cl.n++;
        merged=true; break;
      }
    }
    if(!merged) clusters.push({sx:p.x,sy:p.y,sz:p.z,n:1});
  });

  POLES = clusters.map(cl => ({x:cl.sx/cl.n, y:cl.sy/cl.n, z:cl.sz/cl.n}));
}

function _drawPolesAndCage() {
  if(POLES.length === 0) return;

  const right = POLES.filter(p => p.x >= 0);
  const left  = POLES.filter(p => p.x <  0);

  const cx = POLES.reduce((s,p)=>s+p.x,0)/POLES.length;
  const cy = POLES.reduce((s,p)=>s+p.y,0)/POLES.length;
  const cz = POLES.reduce((s,p)=>s+p.z,0)/POLES.length;

  const angleYZ = p => Math.atan2(p.z - cz, p.y - cy);
  right.sort((a,b) => angleYZ(a) - angleYZ(b));
  left.sort((a,b)  => angleYZ(a) - angleYZ(b));
  const n = Math.min(right.length, left.length);

  // Dots
  const dotVisible = cageOffset === 0;
  const dotMat  = new THREE.MeshBasicMaterial({color:0x00aaff, depthTest:false, depthWrite:false});
  const dotMatM = new THREE.MeshBasicMaterial({color:0x0055aa, depthTest:false, depthWrite:false});
  [...right.slice(0,n), ...left.slice(0,n)].forEach((p, i) => {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.004,10,10), i < n ? dotMat : dotMatM);
    dot.renderOrder = 999;
    dot.visible = dotVisible;
    dot.position.set(p.x, p.y, p.z);
    dot.userData.isCageDot = true;
    dot.userData.polePos = {x:p.x, y:p.y, z:p.z};
    const hz = new THREE.Mesh(new THREE.SphereGeometry(0.018,6,6), new THREE.MeshBasicMaterial({visible:false}));
    hz.userData.isCageHitZone = true;
    dot.add(hz);
    poleCageGroup.add(dot);
  });

  const edgeMat = new THREE.LineBasicMaterial({color:0x22d3ee, transparent:true, opacity:0.8, depthTest:true});
  const spokeMat = new THREE.LineBasicMaterial({color:0x22d3ee, transparent:true, opacity:0.6, depthTest:true});

  const addEdge = (pa, pb, mat) => {
    if(!pa || !pb) return;
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(pa.x, pa.y, pa.z),
      new THREE.Vector3(pb.x, pb.y, pb.z)
    ]);
    const line = new THREE.Line(geo, mat || edgeMat);
    line.renderOrder = 998;
    poleCageGroup.add(line);
  };

  // Cage loops + struts — with resolution subdivision
  // ptsPerArc: number of lerp points inserted between each pole pair
  const ptsPerArc = Math.max(0, shirtRes - 1);

  // Build a subdivided loop from an ordered array of poles
  // Returns array of Vector3 for the full subdivided ring
  function subdividedLoop(poles) {
    const result = [];
    for(let i = 0; i < poles.length; i++) {
      result.push(new THREE.Vector3(poles[i].x, poles[i].y, poles[i].z));
      const next = poles[(i+1) % poles.length];
      for(let k = 1; k <= ptsPerArc; k++) {
        const t = k / (ptsPerArc + 1);
        result.push(new THREE.Vector3(
          poles[i].x + (next.x - poles[i].x) * t,
          poles[i].y + (next.y - poles[i].y) * t,
          poles[i].z + (next.z - poles[i].z) * t
        ));
      }
    }
    return result;
  }

  const rightLoop = subdividedLoop(right.slice(0, n));
  const leftLoop  = subdividedLoop(left.slice(0, n));
  const loopN = rightLoop.length;
  const stride = ptsPerArc + 1; // points per arc segment including start pole

  // ── offsetPoint: uses cage loop curve normals (matches Houdini peak behavior) ──
  const _opInvMat = new THREE.Matrix4().copy(ringsS.bodyGroup.matrixWorld).invert();
  const _opRC = new THREE.Raycaster();

  // Compute outward curve normals for each loop point
  // Normal = tangent × up, flipped to point outward — same as Houdini's vertex normals on curve mesh
  const _computeLoopNormals = (loop) => {
    const N = loop.length;
    return loop.map((p, i) => {
      const prev = loop[(i+N-1)%N];
      const next = loop[(i+1)%N];
      const tangent = new THREE.Vector3(next.x-prev.x, next.y-prev.y, next.z-prev.z).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0,1,0)).normalize();
      if(normal.x*p.x + normal.z*p.z < 0) normal.negate();
      return normal;
    });
  };
  const _rightLoopNormals = _computeLoopNormals(rightLoop);
  const _leftLoopNormals  = _computeLoopNormals(leftLoop);

  // Build lookup map: position key → curve normal
  const _loopNormalMap = new Map();
  const _pKey = p => `${p.x.toFixed(5)},${p.y.toFixed(5)},${p.z.toFixed(5)}`;
  rightLoop.forEach((p,i) => _loopNormalMap.set(_pKey(p), _rightLoopNormals[i]));
  leftLoop.forEach((p,i)  => _loopNormalMap.set(_pKey(p), _leftLoopNormals[i]));

  function offsetPoint(p) {
    const pv = (p instanceof THREE.Vector3) ? p : new THREE.Vector3(p.x, p.y, p.z);
    if(cageOffset === 0) return pv.clone();
    const curveNormal = _loopNormalMap.get(_pKey(pv));
    if(curveNormal) {
      return new THREE.Vector3(
        pv.x + curveNormal.x * cageOffset,
        pv.y + curveNormal.y * cageOffset,
        pv.z + curveNormal.z * cageOffset
      );
    }
    // Fallback for non-loop points: horizontal raycast
    const pWorld = pv.clone().applyMatrix4(ringsS.bodyGroup.matrixWorld);
    const dir = new THREE.Vector3(pWorld.x, 0, pWorld.z).normalize();
    if(dir.length() < 1e-6) return pv.clone();
    const origin = new THREE.Vector3(0, pWorld.y, 0).applyMatrix4(ringsS.bodyGroup.matrixWorld);
    _opRC.set(origin, dir); _opRC.far = 1.0;
    const hits = _opRC.intersectObject(ringsS.castMesh, false);
    if(!hits.length) return pv.clone();
    const hitLocal = hits[0].point.clone().applyMatrix4(_opInvMat);
    let hitN = hits[0].face.normal.clone().transformDirection(ringsS.bodyGroup.matrixWorld).normalize();
    if(hitN.dot(dir) < 0) hitN.negate();
    const nLocal = hitN.clone().transformDirection(_opInvMat).normalize();
    return new THREE.Vector3(
      hitLocal.x + nLocal.x * cageOffset,
      hitLocal.y + nLocal.y * cageOffset,
      hitLocal.z + nLocal.z * cageOffset
    );
  }

  // Apply offsetPoint to every point in a loop array, return new array
  function offsetLoop(loop) {
    return loop.map(p => offsetPoint(p));
  }

  // Draw cage loop edges (only at body surface — hidden when offset since panels show shape)
  if(cageOffset === 0) {
    for(let i = 0; i < loopN; i++) addEdge(rightLoop[i], rightLoop[(i+1) % loopN]);
    for(let i = 0; i < loopN; i++) addEdge(leftLoop[i],  leftLoop[(i+1)  % loopN]);
    for(let i = 0; i < n; i++) addEdge(right[i], left[i]);
  } else {
    for(let i = 0; i < loopN; i++) addEdge(offsetPoint(rightLoop[i]), offsetPoint(rightLoop[(i+1) % loopN]));
    for(let i = 0; i < loopN; i++) addEdge(offsetPoint(leftLoop[i]),  offsetPoint(leftLoop[(i+1)  % loopN]));
    for(let i = 0; i < n; i++) addEdge(offsetPoint(right[i]), offsetPoint(left[i]));
  }

  let conformRingsCache = null;
  // Cage face panels — matching Houdini junction_connections logic.
  // Poles sorted by Y: top 2 = neck group, bottom 2 = waist group, rest = mid.
  // Hole arc: both poles in same group (neck↔neck or waist↔waist).
  // Face arc: poles in different groups — these get panels.

  const rpoles = right.slice(0, n);
  const byY = rpoles.map((p,i) => ({p,i})).sort((a,b) => b.p.y - a.p.y);
  const neckSet  = new Set(byY.slice(0, 2).map(x => x.i));
  const waistSet = new Set(byY.slice(n-2).map(x => x.i));
  const groupOf  = i => neckSet.has(i) ? 'neck' : waistSet.has(i) ? 'waist' : 'mid';

  for(let i = 0; i < n; i++) {
    const gA = groupOf(i);
    const gB = groupOf((i+1) % n);
    if(gA === gB) continue; // same group = hole arc, skip

    const startIdx = i * stride;
    const segSpokes = [];
    for(let k = 0; k <= stride; k++) {
      const idx = (startIdx + k) % loopN;
      segSpokes.push([
        new THREE.Vector3(rightLoop[idx].x, rightLoop[idx].y, rightLoop[idx].z),
        new THREE.Vector3(leftLoop[idx].x,  leftLoop[idx].y,  leftLoop[idx].z)
      ]);
    }
    const beforeCount = poleCageGroup.children.length;
    buildSpokeGrid(segSpokes, true);
    // Ray-project each cage panel vertex onto body surface, then offset along normal
    const invMat = new THREE.Matrix4().copy(ringsS.bodyGroup.matrixWorld).invert();
    for(let c = beforeCount; c < poleCageGroup.children.length; c++) {
      const child = poleCageGroup.children[c];
      if(!child.isMesh || child.material !== panelMat) continue;
      const pos = child.geometry.attributes.position;
      const rc = new THREE.Raycaster();
      for(let vi = 0; vi < pos.count; vi++) {
        const pLocal = new THREE.Vector3(pos.getX(vi), pos.getY(vi), pos.getZ(vi));
        const pWorld = pLocal.clone().applyMatrix4(ringsS.bodyGroup.matrixWorld);
        // Ray direction: outward from body Y-axis
        const dir = new THREE.Vector3(pWorld.x, 0, pWorld.z).normalize();
        if(dir.length() < 1e-6) continue;
        // Start from inside
        const origin = new THREE.Vector3(0, pWorld.y, 0).applyMatrix4(ringsS.bodyGroup.matrixWorld);
        rc.set(origin, dir);
        rc.far = 1.0;
        const hits = rc.intersectObject(ringsS.castMesh, false);
        if(hits.length > 0) {
          const hitPtLocal = hits[0].point.clone().applyMatrix4(invMat);
          let hitNormal = hits[0].face.normal.clone()
            .transformDirection(ringsS.bodyGroup.matrixWorld).normalize();
          // Ensure normal points outward (away from body center)
          if(hitNormal.dot(dir) < 0) hitNormal.negate();
          // Transform normal to local space
          const normalLocal = hitNormal.clone().transformDirection(invMat).normalize();
          pos.setXYZ(vi,
            hitPtLocal.x + normalLocal.x * cageOffset,
            hitPtLocal.y + normalLocal.y * cageOffset,
            hitPtLocal.z + normalLocal.z * cageOffset
          );
        }
      }
      pos.needsUpdate = true;
      child.geometry.computeVertexNormals();

      // Fuse panel corners to nearest offset loop point — closes the hourglass gap
      if(cageOffset > 0) {
        const offRight = rightLoop.map(p => offsetPoint(p));
        const offLeft  = leftLoop.map(p => offsetPoint(p));
        const allOffPts = [...offRight, ...offLeft];
        for(let vi = 0; vi < pos.count; vi++) {
          const pv = new THREE.Vector3(pos.getX(vi), pos.getY(vi), pos.getZ(vi));
          // Only snap corner vertices (first and last row of panel)
          const isCorner = vi < 2 || vi >= pos.count - 2;
          if(!isCorner) continue;
          let nearest = allOffPts[0], bestD = Infinity;
          allOffPts.forEach(op => {
            const d = pv.distanceTo(op);
            if(d < bestD) { bestD = d; nearest = op; }
          });
          // Only snap if close enough (within reasonable distance)
          if(bestD < 0.1) {
            pos.setXYZ(vi, nearest.x, nearest.y, nearest.z);
          }
        }
        pos.needsUpdate = true;
      }
    }
  }

  // Debug dots: show subdivided points only when res > 1 and no offset
  if(ptsPerArc > 0 && cageOffset === 0) {
    const subDotMat = new THREE.MeshBasicMaterial({color:0x00ffaa, depthTest:false, depthWrite:false});
    [...rightLoop, ...leftLoop].forEach((p, i) => {
      // Only show interpolated pts, not the original poles
      const isPole = (i % stride === 0);
      if(!isPole) {
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.003, 6, 6), subDotMat);
        dot.position.set(p.x, p.y, p.z);
        dot.userData.isCageDot = true;
        dot.renderOrder = 999;
        poleCageGroup.add(dot);
      }
    });
  }

  function sortByXZAngle(pts, cx, cz) {
    return pts.slice().sort((a,b)=>Math.atan2(a.z-cz,a.x-cx)-Math.atan2(b.z-cz,b.x-cx));
  }
  function sortByYZAngle(pts, cy, cz) {
    return pts.slice().sort((a,b)=>Math.atan2(a.z-cz,a.y-cy)-Math.atan2(b.z-cz,b.y-cy));
  }
  function anchorAnglesXZ(anchors, origin) {
    return anchors.map(p=>Math.atan2(p.z-origin.z,p.x-origin.x));
  }
  function anchorAnglesYZ(anchors, origin) {
    return anchors.map(p=>Math.atan2(p.z-origin.z,p.y-origin.y));
  }

    function measureRingRadius(seedIdx) {
    const s = SEEDS[seedIdx]; if(!s) return 0;
    const seedPos = new THREE.Vector3(s.x, s.y, s.z);
    const params = getRingParams(seedPos, undefined); if(!params) return 0;
    const { fanOrigin, ringAxis, castDist } = params;
    const axN = ringAxis.clone().normalize();
    const tmp = Math.abs(axN.y)<0.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
    const u = new THREE.Vector3().crossVectors(tmp,axN).normalize();
    const v = new THREE.Vector3().crossVectors(axN,u).normalize();
    const rc = new THREE.Raycaster();
    const invMat = new THREE.Matrix4().copy(ringsS.bodyGroup.matrixWorld).invert();
    const dists = [];
    for(let i=0;i<16;i++){
      const a=(i/16)*Math.PI*2;
      const dir=new THREE.Vector3(u.x*Math.cos(a)+v.x*Math.sin(a),u.y*Math.cos(a)+v.y*Math.sin(a),u.z*Math.cos(a)+v.z*Math.sin(a)).normalize();
      const startLocal=fanOrigin.clone().addScaledVector(dir,castDist);
      const inwardDir=fanOrigin.clone().sub(startLocal).normalize();
      rc.set(startLocal.clone().applyMatrix4(ringsS.bodyGroup.matrixWorld),inwardDir.clone().transformDirection(ringsS.bodyGroup.matrixWorld).normalize());
      rc.far=castDist*2.5;
      const hits=rc.intersectObject(ringsS.castMesh,false);
      if(hits.length>0) dists.push(hits[0].point.clone().applyMatrix4(invMat).distanceTo(fanOrigin));
    }
    dists.sort((a,b)=>a-b);
    const base=dists.length?dists[Math.floor(dists.length/2)]:castDist*0.7;
    return base*getRingScale(seedIdx);
  }

  function projectPoleToYRing(pole, ringOrigin, ringRadius) {
    const dx=pole.x-ringOrigin.x, dz=pole.z-ringOrigin.z;
    const dist=Math.sqrt(dx*dx+dz*dz); if(dist<1e-6) return null;
    return new THREE.Vector3(ringOrigin.x+(dx/dist)*ringRadius, ringOrigin.y, ringOrigin.z+(dz/dist)*ringRadius);
  }

  function projectPoleToXRing(pole, ringOrigin, ringRadius) {
    const dy=pole.y-ringOrigin.y, dz=pole.z-ringOrigin.z;
    const dist=Math.sqrt(dy*dy+dz*dz); if(dist<1e-6) return null;
    return new THREE.Vector3(ringOrigin.x, ringOrigin.y+(dy/dist)*ringRadius, ringOrigin.z+(dz/dist)*ringRadius);
  }

  function getFanOrigin(seedIdx) {
    const s=SEEDS[seedIdx]; if(!s) return null;
    const p=getRingParams(new THREE.Vector3(s.x,s.y,s.z),undefined);
    return p?p.fanOrigin:null;
  }

    function makeTube(ringA, ringB) {
    if(!ringA||!ringB||ringA.length===0||ringB.length===0||ringA.length!==ringB.length) return;
    const n=ringA.length;
    const verts=[], indices=[];
    for(let i=0;i<n;i++){verts.push(ringA[i].x,ringA[i].y,ringA[i].z);verts.push(ringB[i].x,ringB[i].y,ringB[i].z);}
    for(let i=0;i<n;i++){const j=(i+1)%n,a=i*2,b=i*2+1,c=j*2+1,d=j*2;indices.push(a,b,c,a,c,d);}
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
    geo.setIndex(indices); geo.computeVertexNormals();
    const mesh=new THREE.Mesh(geo,panelMat); mesh.renderOrder=997;
    poleCageGroup.add(mesh);
    return mesh;
  }

  function getRingPts(seedIdx) {
    const s=SEEDS[seedIdx]; if(!s) return null;
    const seedPos=new THREE.Vector3(s.x,s.y,s.z);
    const params=getRingParams(seedPos,undefined); if(!params) return null;
    const {fanOrigin,ringAxis,castDist,xClamp,perfectCircle}=params;
    const pts=buildContourRing(fanOrigin,ringAxis,castDist,xClamp,perfectCircle,getRingScale(seedIdx));
    return pts.slice(0,-1);
  }

    // ── Spoke grids: cage → boundary rings with subdivision ───────────────
  // For each spoke (cage pole → chain of ring pts), lerp ptsPerArc intermediate
  // pts along it. Connect adjacent spokes at each level → horizontal rows → quads.

  function lerpEdge(a, b, N) {
    return Array.from({length:N}, (_,i) => new THREE.Vector3().lerpVectors(a, b, N>1?i/(N-1):0));
  }

  function buildPatch(top, bot, left, right) {
    const Nu=top.length, Nv=left.length;
    if(!top||!bot||!left||!right||Nu<2||Nv<2||Nu!==bot.length||Nv!==right.length) return;
    const positions=[], indices=[];
    for(let v=0;v<Nv;v++){
      const tv=v/(Nv-1);
      for(let u=0;u<Nu;u++){
        const tu=u/(Nu-1);
        const T=top[u],B=bot[u],L=left[v],R=right[v];
        const C00=top[0],C10=top[Nu-1],C01=bot[0],C11=bot[Nu-1];
        if(!T||!B||!L||!R) return;
        positions.push(
          (1-tv)*T.x+tv*B.x+(1-tu)*L.x+tu*R.x-((1-tv)*(1-tu)*C00.x+(1-tv)*tu*C10.x+tv*(1-tu)*C01.x+tv*tu*C11.x),
          (1-tv)*T.y+tv*B.y+(1-tu)*L.y+tu*R.y-((1-tv)*(1-tu)*C00.y+(1-tv)*tu*C10.y+tv*(1-tu)*C01.y+tv*tu*C11.y),
          (1-tv)*T.z+tv*B.z+(1-tu)*L.z+tu*R.z-((1-tv)*(1-tu)*C00.z+(1-tv)*tu*C10.z+tv*(1-tu)*C01.z+tv*tu*C11.z)
        );
      }
    }
    for(let v=0;v<Nv-1;v++) for(let u=0;u<Nu-1;u++){
      const a=v*Nu+u,b=v*Nu+u+1,c=(v+1)*Nu+u+1,d=(v+1)*Nu+u;
      indices.push(a,b,c,a,c,d);
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
    geo.setIndex(indices); geo.computeVertexNormals();
    const mesh=new THREE.Mesh(geo,panelMat); mesh.renderOrder=997;
    poleCageGroup.add(mesh);
  }

  // Body-conforming rings sorted top→bottom for cage panel vertex snapping
  // Each entry: { y, pts } where pts is the 48-pt body surface ring

  // Snap a point to the body surface at its Y level.
  // Finds the bracketing rings, lerps the radius, snaps XZ to that radius.
  function getConformRings() {
    const ringSeeds = [5, 3, 4, 6];
    return ringSeeds.map(idx => {
      const s = SEEDS[idx]; if(!s) return null;
      const seedPos = new THREE.Vector3(s.x, s.y, s.z);
      const params = getRingParams(seedPos, undefined); if(!params) return null;
      // Always use scale=1.0 — pure body surface, cageOffset applied separately
      const pts = buildContourRing(params.fanOrigin, params.ringAxis, params.castDist, params.xClamp, params.perfectCircle, 1.0);
      return { y: params.fanOrigin.y, pts: pts.slice(0,-1), origin: params.fanOrigin.clone() };
    }).filter(Boolean).sort((a,b) => b.y - a.y);
  }

  function conformPt(p, scale, conformRings) {
    if(conformRings.length === 0) return p;
    let upper = conformRings[0], lower = conformRings[conformRings.length-1];
    for(let i = 0; i < conformRings.length-1; i++) {
      if(p.y <= conformRings[i].y && p.y >= conformRings[i+1].y) {
        upper = conformRings[i]; lower = conformRings[i+1]; break;
      }
    }
    const t = upper.y === lower.y ? 0 :
      (upper.y - p.y) / (upper.y - lower.y);
    const ptAngle = Math.atan2(p.z - upper.origin.z, p.x - upper.origin.x);
    const nearest = (ringPts, origin) => {
      let best = ringPts[0], bestD = Infinity;
      for(const rp of ringPts) {
        const a = Math.atan2(rp.z - origin.z, rp.x - origin.x);
        let d = Math.abs(a - ptAngle); if(d > Math.PI) d = Math.PI*2-d;
        if(d < bestD) { bestD = d; best = rp; }
      }
      return best;
    };
    const uPt = nearest(upper.pts, upper.origin);
    const lPt = nearest(lower.pts, lower.origin);
    const uR = Math.sqrt((uPt.x-upper.origin.x)**2 + (uPt.z-upper.origin.z)**2);
    const lR = Math.sqrt((lPt.x-lower.origin.x)**2 + (lPt.z-lower.origin.z)**2);
    const targetR = uR + (lR - uR) * t; // ring pts already scaled via getRingScale
    const ox = upper.origin.x + (lower.origin.x - upper.origin.x) * t;
    const oz = upper.origin.z + (lower.origin.z - upper.origin.z) * t;
    const dx = p.x - ox, dz = p.z - oz;
    const curR = Math.sqrt(dx*dx + dz*dz);
    if(curR < 1e-6) return p;
    return new THREE.Vector3(ox + (dx/curR)*targetR, p.y, oz + (dz/curR)*targetR);
  }

  function conformMesh(mesh, scale, cr) {
    const pos = mesh.geometry.attributes.position;
    for(let i = 0; i < pos.count; i++) {
      const p = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
      const snapped = conformPt(p, scale, cr);
      pos.setXYZ(i, snapped.x, snapped.y, snapped.z);
    }
    pos.needsUpdate = true;
    mesh.geometry.computeVertexNormals();
  }

  function buildSpokeGrid(spokes, open) {
    if(!spokes || spokes.length < 2) return;
    const depth = spokes[0].length;
    const subSpokes = spokes.map(spoke => {
      const result = [];
      for(let i = 0; i < spoke.length - 1; i++) {
        result.push(spoke[i].clone());
        for(let k = 1; k <= ptsPerArc; k++) {
          const t = k / (ptsPerArc + 1);
          result.push(new THREE.Vector3().lerpVectors(spoke[i], spoke[i+1], t));
        }
      }
      result.push(spoke[spoke.length-1].clone());
      return result;
    });
    const subDepth = subSpokes[0].length;
    const nSpokes  = subSpokes.length;
    const loopCount = open ? nSpokes - 1 : nSpokes;

    subSpokes.forEach(spoke => {
      for(let i = 0; i < subDepth-1; i++) addEdge(spoke[i], spoke[i+1], spokeMat);
    });
    for(let d = 0; d < subDepth; d++) {
      for(let s = 0; s < loopCount; s++) {
        addEdge(subSpokes[s][d], subSpokes[(s+1) % nSpokes][d], spokeMat);
      }
    }
    for(let s = 0; s < loopCount; s++) {
      const leftCol  = subSpokes[s];
      const rightCol = subSpokes[(s+1) % nSpokes];
      const topEdge  = [leftCol[0], rightCol[0]];
      const botEdge  = [leftCol[subDepth-1], rightCol[subDepth-1]];
      const mesh = buildPatch(topEdge, botEdge, leftCol, rightCol);
    }
  }


  // ── Vertical torso grids ──────────────────────────────────────────────
  const allPoles = [...right.slice(0,n), ...left.slice(0,n)];

  const neckOrigin  = getFanOrigin(5);
  const seed4Origin = getFanOrigin(4);
  const underOrigin = getFanOrigin(6);
  const waistOrigin = getFanOrigin(7);

  if(neckOrigin && seed4Origin && underOrigin && waistOrigin) {
    const topPoles = sortByXZAngle(allPoles.slice().sort((a,b)=>b.y-a.y).slice(0,4), 0, 0);
    const botPoles = sortByXZAngle(allPoles.slice().sort((a,b)=>a.y-b.y).slice(0,4), 0, 0);

    // Build full subdivided loops from top/bot cage poles — same as rightLoop/leftLoop
    const topLoop = subdividedLoop(topPoles);
    const botLoop = subdividedLoop(botPoles);

    // Offset versions: roots land exactly on the offset cage surface
    const topLoopOff = offsetLoop(topLoop);
    const botLoopOff = offsetLoop(botLoop);

    const neckR  = measureRingRadius(5);
    const s4R    = measureRingRadius(4);
    const underR = measureRingRadius(6);
    const waistR = measureRingRadius(7);

    // Top spokes: offset cage corner → neck ring (p0 = offset cage edge)
    const topSpokes = topLoop.map((pole, li) => {
      const p0  = topLoopOff[li];
      const nPt = projectPoleToYRing(pole, neckOrigin, neckR);
      if(!nPt) return null;
      const collarPt = new THREE.Vector3().lerpVectors(nPt, p0, collarT);
      return [p0, collarPt];
    }).filter(Boolean);
    if(topSpokes.length >= 2) buildSpokeGrid(topSpokes, false);

    // Bottom spokes: offset cage corner → underbust → hem
    const _rpts6 = getRingPts(6);
    const _rpts7 = getRingPts(7);
    const N6 = botLoop.length;
    const botSpokes = botLoop.map((pole, li) => {
      const p0  = botLoopOff[li];
      const getMatchingRingPt = (rpts, origin) => {
        if(!rpts) return null;
        const a = Math.atan2(pole.z - origin.z, pole.x - origin.x);
        let best = rpts[0], bd = Infinity;
        rpts.forEach(rp => {
          let d = Math.abs(Math.atan2(rp.z - origin.z, rp.x - origin.x) - a);
          if(d > Math.PI) d = Math.PI*2 - d;
          if(d < bd) { bd = d; best = rp; }
        });
        return best.clone();
      };
      const upt = getMatchingRingPt(_rpts6, underOrigin) || projectPoleToYRing(pole, underOrigin, underR);
      if(!upt) return null;
      const wpt = getMatchingRingPt(_rpts7, waistOrigin) || projectPoleToYRing(upt, waistOrigin, waistR);
      if(!wpt) return null;
      const hemPt = new THREE.Vector3().lerpVectors(wpt, upt, hemT);
      return [p0, upt, hemPt];
    }).filter(Boolean);
    if(botSpokes.length >= 2) buildSpokeGrid(botSpokes, false);
  }

  // ── Arm grids ──────────────────────────────────────────────────────────
  function buildArmGrid(cageLoop, innerIdx, outerIdx) {
    const innerOrigin = getFanOrigin(innerIdx);
    const outerOrigin = getFanOrigin(outerIdx);
    if(!innerOrigin || !outerOrigin) return;

    const innerR = measureRingRadius(innerIdx);
    const outerR = measureRingRadius(outerIdx);
    const _irpts = getRingPts(innerIdx);
    const _orpts = getRingPts(outerIdx);

    const cageLoopOff = offsetLoop(cageLoop);
    const indexed = cageLoop.map((pole, i) => ({ pole, off: cageLoopOff[i], i }));
    indexed.sort((a,b) =>
      Math.atan2(a.pole.z - innerOrigin.z, a.pole.y - innerOrigin.y) -
      Math.atan2(b.pole.z - innerOrigin.z, b.pole.y - innerOrigin.y)
    );

    // Cage → inner ring: use proportional distribution (cage poles cluster at same YZ angle)
    const N = indexed.length;
    // Find inner ring point closest to first cage pole to align start
    const firstPole = indexed[0].pole;
    let startInner = 0;
    if(_irpts) {
      const a0 = Math.atan2(firstPole.z - innerOrigin.z, firstPole.y - innerOrigin.y);
      let bd = Infinity;
      _irpts.forEach((rp, i) => {
        let d = Math.abs(Math.atan2(rp.z - innerOrigin.z, rp.y - innerOrigin.y) - a0);
        if(d > Math.PI) d = Math.PI*2 - d;
        if(d < bd) { bd = d; startInner = i; }
      });
    }

    const innerPts = indexed.map((_, i) => {
      if(!_irpts) return projectPoleToXRing(indexed[i].pole, innerOrigin, innerR);
      return _irpts[(startInner + Math.round((i / N) * _irpts.length)) % _irpts.length].clone();
    });

    // Inner → outer: use same start index mapped to outer ring size
    let startOuter = 0;
    if(_orpts) {
      startOuter = Math.round((startInner / (_irpts ? _irpts.length : 48)) * _orpts.length) % _orpts.length;
    }
    const outerPts = indexed.map((_, i) => {
      if(!_orpts) return projectPoleToXRing(indexed[i].pole, outerOrigin, outerR);
      return _orpts[(startOuter + Math.round((i / N) * _orpts.length)) % _orpts.length].clone();
    });

    if(innerPts.filter(Boolean).length < 2 || outerPts.filter(Boolean).length < 2) return;

    const cuffPts = outerPts.map((p, i) => p && innerPts[i]
      ? new THREE.Vector3().lerpVectors(p, innerPts[i], sleeveT)
      : null
    );

    const spokes = indexed.map(({ off }, i) => {
      if(!innerPts[i] || !cuffPts[i]) return null;
      return [off, innerPts[i], cuffPts[i]];
    }).filter(Boolean);

    if(spokes.length >= 2) buildSpokeGrid(spokes, false);
  }

  // Even selection of cage poles for arm grids (unused but kept for future use)
  function evenlySpaced6(sorted) {
    const count = sorted.length;
    if(count <= 6) return sorted.slice();
    return Array.from({length: 6}, (_, i) => sorted[Math.round(i * count / 6) % count]);
  }

  // Pass the full subdivided cage loops (with offset applied inside buildArmGrid)
  buildArmGrid(rightLoop, 0, 14);
  buildArmGrid(leftLoop,  1, 15);
}

function initPoles() {
  ringsS.bodyGroup.add(poleCageGroup);
  computePoles();
  _drawPolesAndCage();
}


// ── Borders ─────────────────────────────────────────────────


function computeVoronoiBorders() {
  const pos = ringsBGeo.attributes.position.array;
  const idx = ringsBGeo.index.array;

  // For each vertex, find nearest seed index
  const nVerts = pos.length / 3;
  const vertRegion = new Int32Array(nVerts);
  for(let i = 0; i < nVerts; i++) {
    const vx = pos[i*3], vy = pos[i*3+1], vz = pos[i*3+2];
    let best = 0, bestD = Infinity;
    SEEDS.forEach((s, si) => {
      const dx=s.x-vx, dy=s.y-vy, dz=s.z-vz;
      const d = dx*dx+dy*dy+dz*dz;
      if(d < bestD) { bestD=d; best=si; }
    });
    vertRegion[i] = best;
  }

  // Accumulate border midpoints keyed by sorted region pair
  const borderMap = {}; // "rA_rB" -> {sum: Vector3, count, rA, rB}

  // Walk every triangle edge (3 edges per face, deduplicate by min/max)
  const nFaces = idx.length / 3;
  const seenEdges = new Set();
  for(let f = 0; f < nFaces; f++) {
    const a = idx[f*3], b = idx[f*3+1], c = idx[f*3+2];
    [[a,b],[b,c],[c,a]].forEach(([i,j]) => {
      const key = i < j ? `${i}_${j}` : `${j}_${i}`;
      if(seenEdges.has(key)) return;
      seenEdges.add(key);
      const rA = vertRegion[i], rB = vertRegion[j];
      if(rA === rB) return; // same region, skip
      const pairKey = rA < rB ? `${rA}_${rB}` : `${rB}_${rA}`;
      if(!borderMap[pairKey]) {
        borderMap[pairKey] = {
          sum: new THREE.Vector3(), count: 0,
          rA: Math.min(rA,rB), rB: Math.max(rA,rB)
        };
      }
      // Midpoint of this edge
      const mx = (pos[i*3]+pos[j*3])*0.5;
      const my = (pos[i*3+1]+pos[j*3+1])*0.5;
      const mz = (pos[i*3+2]+pos[j*3+2])*0.5;
      borderMap[pairKey].sum.add(new THREE.Vector3(mx,my,mz));
      borderMap[pairKey].count++;
    });
  }

  // Compute centroids
  const borders = [];
  Object.values(borderMap).forEach(b => {
    borders.push({
      pos: b.sum.divideScalar(b.count),
      rA: b.rA,
      rB: b.rB
    });
  });
  return borders;
}

const borderDotGroup = new THREE.Group();

function refreshBorders() {
  while(borderDotGroup.children.length) borderDotGroup.remove(borderDotGroup.children[0]);

  const sources = SEEDS;
  const pos = ringsBGeo.attributes.position.array;
  const idx = ringsBGeo.index.array;
  const nV = pos.length / 3;

  const vertRegion = new Int32Array(nV);
  for(let i=0; i<nV; i++) {
    const vx=pos[i*3], vy=pos[i*3+1], vz=pos[i*3+2];
    let best=0, bestD=Infinity;
    sources.forEach((s,si) => {
      const dx=s.x-vx, dy=s.y-vy, dz=s.z-vz;
      const d=dx*dx+dy*dy+dz*dz;
      if(d<bestD){bestD=d;best=si;}
    });
    vertRegion[i]=best;
  }

  const borderMap={};
  const seen=new Set();
  const nF=idx.length/3;
  for(let f=0;f<nF;f++){
    const a=idx[f*3],b=idx[f*3+1],c=idx[f*3+2];
    [[a,b],[b,c],[c,a]].forEach(([i,j])=>{
      const ek=i<j?`${i}_${j}`:`${j}_${i}`;
      if(seen.has(ek))return; seen.add(ek);
      const rA=vertRegion[i],rB=vertRegion[j];
      if(rA===rB)return;
      const pk=rA<rB?`${rA}_${rB}`:`${rB}_${rA}`;
      if(!borderMap[pk])borderMap[pk]={sum:new THREE.Vector3(),count:0};
      borderMap[pk].sum.add(new THREE.Vector3(
        (pos[i*3]+pos[j*3])*0.5,
        (pos[i*3+1]+pos[j*3+1])*0.5,
        (pos[i*3+2]+pos[j*3+2])*0.5));
      borderMap[pk].count++;
    });
  }

  const mat=new THREE.MeshBasicMaterial({color:0xffffff,depthTest:false,depthWrite:false});
  Object.values(borderMap).forEach(b=>{
    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.004,6,6),mat);
    dot.position.copy(b.sum.divideScalar(b.count));
    dot.renderOrder=1000;
    borderDotGroup.add(dot);
  });
}

const wireMat = new THREE.LineBasicMaterial({
  color: 0x22d3ee, transparent: true, opacity: 0.85, depthTest: false, depthWrite: false
});
function applyConstructionVisibility() {
  poleCageGroup.children.forEach(c => {
    if(c.isMesh && c.material === panelMat) {
      if(!c.userData.hasWireframe) {
        // Build explicit quad grid edges — no diagonals
        const pos = c.geometry.attributes.position;
        const idx = c.geometry.index;
        // Determine grid dimensions from index count: Nu*Nv quads → (Nu)*(Nv) verts
        // Each quad = 2 triangles = 6 indices. Total quads = idx.count/6
        const nQuads = idx.count / 6;
        // Find Nu: scan first row until we wrap
        // Simpler: just draw edges from index pairs (a,b), (b,c), (c,d), (d,a) for each quad
        const edgePts = [];
        for(let q = 0; q < nQuads; q++) {
          const base = q * 6;
          const a = idx.getX(base),   b = idx.getX(base+1);
          const c2 = idx.getX(base+2), d = idx.getX(base+5);
          const pts = [a,b,c2,d].map(i => new THREE.Vector3(
            pos.getX(i), pos.getY(i), pos.getZ(i)
          ));
          // 4 edges of the quad
          edgePts.push(pts[0],pts[1], pts[1],pts[2], pts[2],pts[3], pts[3],pts[0]);
        }
        const wfGeo = new THREE.BufferGeometry().setFromPoints(edgePts);
        const wf = new THREE.LineSegments(wfGeo,
          new THREE.LineBasicMaterial({color:0x22d3ee, transparent:true, opacity:0.8, depthTest:false})
        );
        wf.renderOrder = 999;
        c.add(wf);
        c.userData.hasWireframe = true;
      }
    }
  });
}

// ── Intro reveal sequence ─────────────────────────────────────────────────
// Layers, in reveal order:
//   0  seeds (landmark rings)          0.0 – 0.20
//   1  voronoi mesh (body coloring)    0.15 – 0.35
//   2  border dots                     0.30 – 0.50
//   3  cage / pole lines + dots        0.45 – 0.65
//   4  panel meshes + wireframes       0.60 – 0.78
//   5  shirt (ringsMesh solid)         0.73 – 0.88

const REVEAL_DUR = 18000; // ms for full sequence (includes placement intro)
let revealStart = null;
let revealDone  = false;

// Collect all UI elements that should be locked during reveal
const uiToLock = ['ui', 'ui2', 'ui3'];

// Placement phase: 0.0 – 0.30, main reveal: 0.30 – 1.0
// Named seeds appear one by one with labels
const PLACEMENT_SEEDS = [
  { idx: 2,       label: 'head top'   },

  { idx: 0,       label: 'shoulder'   },

const PLACEMENT_END = 0.35; // fraction of total where placement ends
const PLACE_PER = PLACEMENT_END / PLACEMENT_SEEDS.length; // time per seed

const REVEAL_LABELS = [
  { t: 0.00, text: 'placing head top' },
  { t: 0.04, text: 'placing neck' },
  { t: 0.08, text: 'placing shoulder' },

  { t: 0.32, text: 'placing foot' },
  { t: 0.35, text: 'computing voronoi regions' },
  { t: 0.46, text: 'tracing region borders' },
  { t: 0.57, text: 'projecting cage poles' },
  { t: 0.67, text: 'constructing panels' },
  { t: 0.78, text: 'assembling garment' },

];

function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
function clamp01(v)   { return Math.max(0, Math.min(1, v)); }
function fade(start, end, t) { return clamp01(easeInOut(clamp01((t - start) / (end - start)))); }

// Capture initial material opacity targets


setUILocked(true);

window.replayReveal = () => {
  revealStart = null;

// Show reveal label
function setRevealLabel(t) {
  let current = '';
  for(const entry of REVEAL_LABELS) { if(t >= entry.t) current = entry.text; }
  if(revealLabel.textContent !== current) revealLabel.textContent = current;

}

// Floating seed name label
const seedPlaceLabel = document.createElement('div');
seedPlaceLabel.style.cssText = `

`;

function updateSeedPlaceLabel(t) {
  if(t >= PLACEMENT_END) { seedPlaceLabel.style.opacity = '0'; return; }
  const i = Math.floor(t / PLACE_PER);
  if(i >= PLACEMENT_SEEDS.length) { seedPlaceLabel.style.opacity = '0'; return; }
  const ps = PLACEMENT_SEEDS[i];
  const dot = seedDots[ps.idx];
  if(!dot) return;
  // Project 3D dot position to 2D screen
  const canvas = document.getElementById('canvasRings');
  const rect = canvas.getBoundingClientRect();

  seedPlaceLabel.style.top  = y + 'px';
  seedPlaceLabel.textContent = ps.label;
  seedPlaceLabel.style.opacity = '1';
}

function setMatsOpacity(obj, opacity) {
  obj.traverse(child => {
    if(child.material) {
      child.material.transparent = true;
      child.material.opacity = opacity;
    }
  });
}

function tickReveal(ts) {
  if(!ts) return;
  if(revealStart === null) revealStart = ts;
  const t = Math.min((ts - revealStart) / REVEAL_DUR, 1.0);

  setRevealLabel(t);
  updateSeedPlaceLabel(t);

  // ── placement phase: seeds appear one by one 0.0 – 0.30 ─────────────────
  const placementDone = t >= PLACEMENT_END;
  const lp = document.getElementById('landmarkPanel');
  const ll = document.getElementById('landmarkList');
  if(lp) lp.style.opacity = (t > 0.01 && t < PLACEMENT_END + 0.05) ? '1' : '0';

  PLACEMENT_SEEDS.forEach((ps, i) => {
    const start = i * PLACE_PER;
    const end   = start + PLACE_PER * 0.6;
    const a     = fade(start, end, t);
    // 3D dot
    const dot = seedDots[ps.idx];
    if(dot) { dot.visible = a > 0.005; setMatsOpacity(dot, Math.min(a, 1)); }
    const MIRROR_MAP = {0:1,1:0,12:13,13:12,14:15,15:14,8:9,9:8,10:11,11:10};
    const mirrorIdx = MIRROR_MAP[ps.idx] !== undefined ? MIRROR_MAP[ps.idx] : -1;
    if(mirrorIdx >= 0 && seedDots[mirrorIdx]) {
      seedDots[mirrorIdx].visible = a > 0.005;
      setMatsOpacity(seedDots[mirrorIdx], Math.min(a, 1));
    }
    // Landmark list item
    if(ll) {
      let item = document.getElementById('lm-' + i);
      const wasHidden = !item || item.style.opacity === '0';
      if(!item) {
        item = document.createElement('div');
        item.id = 'lm-' + i;
        item.style.cssText = 'display:flex;align-items:center;gap:8px;opacity:0;transition:opacity 0.25s;';
        const dot = document.createElement('span');
        dot.id = 'lm-dot-' + i;
        dot.style.cssText = 'width:7px;height:7px;border-radius:50%;background:#22d3ee;display:inline-block;flex-shrink:0;box-shadow:0 0 6px #22d3ee88';
        const lbl2 = document.createElement('span');
        lbl2.style.cssText = "font:10px 'DM Mono',monospace;color:#fff;letter-spacing:.08em";
        lbl2.textContent = ps.label;
        item.appendChild(dot); item.appendChild(lbl2);
        ll.appendChild(item);
      }
      const showing = a > 0.1;
      item.style.opacity = showing ? '1' : '0';
      // On first appear, draw dashed trail from panel dot → 3D seed
      if(wasHidden && showing) {
        const panelDot = document.getElementById('lm-dot-' + i);
        const dot3d = seedDots[ps.idx];
        const canvas = document.getElementById('canvasRings');
        const svg = document.getElementById('dragTrails');
        if(panelDot && dot3d && canvas && svg) {
          const panelRect = document.querySelector('.panel.rings').getBoundingClientRect();
          const dotRect = panelDot.getBoundingClientRect();
          const x1 = dotRect.left - panelRect.left + dotRect.width/2;
          const y1 = dotRect.top  - panelRect.top  + dotRect.height/2;
          const canvasRect = canvas.getBoundingClientRect();
          // Use baked seed position — dot may not be in scene yet
          const s = SEEDS[ps.idx];
          const pos3d = new THREE.Vector3(s.x, s.y, s.z).applyMatrix4(ringsS.bodyGroup.matrixWorld);
          const projected = pos3d.clone().project(ringsS.cam);
          const x2 = (projected.x * 0.5 + 0.5) * canvasRect.width + (canvasRect.left - panelRect.left);
          const y2 = (-projected.y * 0.5 + 0.5) * canvasRect.height + (canvasRect.top - panelRect.top);
          const line = document.createElementNS('http://www.w3.org/2000/svg','line');
          line.setAttribute('x1',x1); line.setAttribute('y1',y1);
          line.setAttribute('x2',x2); line.setAttribute('y2',y2);
          line.setAttribute('stroke','#22d3ee'); line.setAttribute('stroke-width','1');
          line.setAttribute('stroke-dasharray','4 3'); line.setAttribute('opacity','0.6');
          line.style.transition = 'opacity 0.5s';
          svg.appendChild(line);
          setTimeout(() => { line.style.opacity='0'; setTimeout(()=>svg.contains(line)&&svg.removeChild(line),600); }, 1400);
        }
      }
    }
  });

  // Remap t for main reveal to start at PLACEMENT_END
  const tMain = placementDone ? (t - PLACEMENT_END) / (1 - PLACEMENT_END) : 0;

  const seedIn   = placementDone ? fade(0.00, 0.15, tMain) : 0;
  const voroIn   = fade(0.15, 0.35, tMain);
  const borderIn = fade(0.30, 0.50, tMain);
  const cageIn   = fade(0.45, 0.65, tMain);
  const panelIn  = fade(0.60, 0.75, tMain);
  const outFade  = fade(0.83, 1.00, tMain);
  const keep     = 1.0 - outFade;

  // ── seeds (all, after placement phase) ────────────────────────────────
  const seedA = seedIn * keep;
  if(placementDone) {
    seedDots.forEach(d => {
      d.visible = seedA > 0.005;
      setMatsOpacity(d, seedA);
    });
  }

  // ── voronoi body mesh ──────────────────────────────────────────────────────
  const voroA = voroIn * keep;
  ringsMesh.visible = voroA > 0.005;
  ringsMesh.material.transparent = true;
  ringsMesh.material.opacity = voroA;

  // ── border dots ─────────────────────────────────────────────────────────
  const borderA = borderIn * keep;
  borderDotGroup.visible = borderA > 0.005;
  setMatsOpacity(borderDotGroup, borderA);

  // ── cage lines/dots: fade IN and STAY ───────────────────────────────────
  const cageA = Math.max(cageIn, cageIn * keep + outFade * 0.5); // hold at 0.5 opacity
  poleCageGroup.children.forEach(c => {
    const isPanel = c.isMesh && c.material === panelMat;
    if(isPanel) {
      const panelA = panelIn * keep;
      c.visible = panelA > 0.005;
      panelMat.opacity = 0.13 * panelA;
      c.children.forEach(wf => {
        if(wf.material) { wf.material.transparent = true; wf.material.opacity = 0.8 * panelA; }
      });
    } else {
      c.visible = cageA > 0.005;
      setMatsOpacity(c, cageA);
    }
  });

  // ── done ─────────────────────────────────────────────────────────────
  if(t >= 1.0 && !revealDone) {
    revealDone = true;
    shirtRes = 2;
    document.getElementById('sliderRes').value = 2;
    rebuildCage();
    ringsMesh.visible = false;
    borderDotGroup.visible = false;
    seedDots.forEach(d => { d.visible = false; });
    poleCageGroup.children.forEach(c => {
      const isPanel = c.isMesh && c.material === panelMat;
      const isCageDot = c.userData.isCageDot;
      if(isPanel) {
        // Keep panel fill at low opacity + wireframe bright
        c.visible = true;
        panelMat.transparent = true;
        panelMat.opacity = 0.10;
        c.children.forEach(wf => {
          if(wf.material) { wf.material.transparent = true; wf.material.opacity = 0.85; }
        });
      } else if(isCageDot) {
        c.visible = false;
      } else {
        // Cage lines — keep visible at good opacity
        c.visible = true;
        setMatsOpacity(c, 0.7);
      }
    });
    setUILocked(false);
    revealLabel.style.opacity = '0';
  }
}

// ── Method A: landmark animation ─────────────────────────────────────────────
// All objects in ray.bodyGroup — orbit with OrbitControls automatically.
// Labels repositioned each frame via _tickMethodA → v.project(cam).
//
// 4 left-half landmark points (BASE_PTS indices):
//   neck_L     [72] [-0.0248, 0.70482] — left corner where shoulder curve meets neckline
//   shoulder_L [84] [-0.0713, 0.6951]  — outermost top-left
//   underarm_L [0]  [-0.0524, 0.6332]  — side seam top / armscye bottom
//   hip_L      [12] [-0.0534, 0.5530]  — bottom-left corner
{
  const FS_ANIM = 0.0;

  const LM = [
    { name: 'neck',     x: -0.0248, y: 0.70482 },
    { name: 'shoulder', x: -0.0713, y: 0.6951  },
    { name: 'underarm', x: -0.0524, y: 0.6332  },
    { name: 'hip',      x: -0.0534, y: 0.5530  },

  const SEAM_EDGES_L = [
    { a: 3, b: 2 }, // hip -> underarm  (side seam)
    { a: 2, b: 1 }, // underarm -> shoulder (armscye)
    { a: 1, b: 0 }, // shoulder -> neck (shoulder seam)
  ];

  const activeDots  = [];
  const activeLines = [];
  let   mirrorGroup = null;
  let   warningEl   = null;
  let   statusEl    = null;
  let   _stepTimer  = null;

  const getPanel  = () => document.querySelector('.panel.ray');
  const getCanvas = () => document.getElementById('canvasRay');

  function makeDot(col, r) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(r || 0.0045, 10, 10),
      new THREE.MeshBasicMaterial({ color: col, depthTest: false, depthWrite: false })
    );
    m.renderOrder = 999;
    return m;
  }

  function makeLabel(text, col) {
    const el = document.createElement('div');
    el.textContent = text;
    el.style.cssText = [
      'position:absolute', 'pointer-events:none', 'z-index:120',
      'font:9px "DM Mono",monospace', 'letter-spacing:.1em', 'text-transform:uppercase',
      'white-space:nowrap', 'color:' + col, 'opacity:0', 'transition:opacity 0.2s',
      'background:rgba(10,10,11,0.6)', 'padding:1px 5px', 'border-radius:2px',
    ].join(';');
    return el;
  }

  function makeDashedLine(ax, ay, az, bx, by, bz, col, opacity) {
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(ax, ay, az),
        new THREE.Vector3(bx, by, bz),
      ]),
      new THREE.LineDashedMaterial({
        color: col, dashSize: 0.006, gapSize: 0.004,
        depthTest: false, depthWrite: false,
        transparent: true, opacity: opacity !== undefined ? opacity : 0.85,
      })
    );
    line.computeLineDistances();
    line.renderOrder = 997;
    return line;
  }

  let _fadeTarget = 0; // 0 = hidden, 1 = fade in

  window._tickMethodA = function() {
    const canvas = getCanvas();
    const panel  = getPanel();
    if (!canvas || !panel) return;
    const cr = canvas.getBoundingClientRect();
    const pr = panel.getBoundingClientRect();
    activeDots.forEach(({ mesh, labelEl }) => {
      if (!mesh.visible || !labelEl) return;
      const v = mesh.position.clone().applyMatrix4(ray.bodyGroup.matrixWorld);
      v.project(ray.cam);
      const x = ( v.x * 0.5 + 0.5) * cr.width  + (cr.left - pr.left);
      const y = (-v.y * 0.5 + 0.5) * cr.height + (cr.top  - pr.top);

      labelEl.style.top     = (y - 10) + 'px';

    });
    if (warningEl && activeDots[0]) {

      v.project(ray.cam);
      const x = ( v.x * 0.5 + 0.5) * cr.width  + (cr.left - pr.left);
      const y = (-v.y * 0.5 + 0.5) * cr.height + (cr.top  - pr.top);

      warningEl.style.top  = (y + 14) + 'px';
    }
    // Smooth fade for panels
    if (_fadeTarget > 0) {
      const FILL_TARGET = 0.30, LINE_TARGET = 0.95, CONN_TARGET = 0.35;
      const spd = 0.03;
      const fm = frontFillMesh.material, bm = backFillMesh.material;
      fm.opacity = Math.min(fm.opacity + spd, FILL_TARGET);
      bm.opacity = Math.min(bm.opacity + spd, FILL_TARGET);
      flLine.material.opacity = Math.min(flLine.material.opacity + spd, LINE_TARGET);
      blLine.material.opacity = Math.min(blLine.material.opacity + spd, LINE_TARGET);
      connData.forEach(cd => {
        cd.line.material.opacity = Math.min(cd.line.material.opacity + spd, CONN_TARGET);
      });
    }
  };

  function clearScene() {
    if(_stepTimer) { clearTimeout(_stepTimer); _stepTimer = null; }
    _fadeTarget = 0;
    frontFillMesh.visible = false; frontFillMesh.material.opacity = 0;
    backFillMesh.visible  = false; backFillMesh.material.opacity  = 0;
    flLine.visible = false; flLine.material.opacity = 0;
    blLine.visible = false; blLine.material.opacity = 0;
    connData.forEach(cd => { cd.line.visible = false; cd.line.material.opacity = 0; });
    activeDots.forEach(({ mesh, labelEl }) => {
      ray.bodyGroup.remove(mesh);
      if (labelEl && labelEl.parentNode) labelEl.parentNode.removeChild(labelEl);
    });
    activeDots.length = 0;
    activeLines.forEach(l => ray.bodyGroup.remove(l));
    activeLines.length = 0;
    if (mirrorGroup) { ray.bodyGroup.remove(mirrorGroup); mirrorGroup = null; }
    if (warningEl && warningEl.parentNode) { warningEl.parentNode.removeChild(warningEl); warningEl = null; }
  }

  function runMethodAAnimation() {
    clearScene();
    const panel = getPanel();
    if (!panel) return;

    if (!statusEl) {
      statusEl = document.createElement('div');
      statusEl.style.cssText = [
        'position:absolute', 'top:42px', 'left:16px', 'z-index:121',
        'pointer-events:none', 'font:8px "DM Mono",monospace',
        'color:#f59e0b', 'letter-spacing:.12em', 'text-transform:uppercase',
        'opacity:0', 'transition:opacity 0.3s',
      ].join(';');
      panel.appendChild(statusEl);
    }
    statusEl.style.opacity = '1';
    statusEl.style.color   = '#f59e0b';
    const cap = document.getElementById('methodACaption');
    if (cap) cap.style.opacity = '0';

    function placeLandmark(idx) {
      const lm  = LM[idx];
      const dot = makeDot(0xf59e0b);
      dot.position.set(lm.x, lm.y, FS_ANIM);
      ray.bodyGroup.add(dot);
      const lbl = makeLabel(lm.name, '#f59e0b');
      panel.appendChild(lbl);
      activeDots.push({ mesh: dot, labelEl: lbl });
      statusEl.textContent = '\u25b6 place \xb7 ' + lm.name;
      dot.scale.set(2.5, 2.5, 2.5);
      setTimeout(() => dot.scale.set(1, 1, 1), 200);
    }

    function drawLeftSeams() {
      statusEl.textContent = '\u25b6 connect \xb7 seam edges';
      SEAM_EDGES_L.forEach(e => {
        const a = LM[e.a], b = LM[e.b];
        const line = makeDashedLine(a.x, a.y, FS_ANIM, b.x, b.y, FS_ANIM, 0xf59e0b);
        ray.bodyGroup.add(line);
        activeLines.push(line);
      });
    }

    function drawRightSide() {
      statusEl.textContent = '\u25b6 symmetrize \xb7 right side';
      mirrorGroup = new THREE.Group();
      mirrorGroup.renderOrder = 998;
      LM.forEach(lm => {
        const dot = makeDot(0xf59e0b, 0.004);
        dot.position.set(-lm.x, lm.y, FS_ANIM);
        dot.material.transparent = true;
        dot.material.opacity = 0.7;
        mirrorGroup.add(dot);
      });
      SEAM_EDGES_L.forEach(e => {
        const a = LM[e.a], b = LM[e.b];
        mirrorGroup.add(makeDashedLine(-a.x, a.y, FS_ANIM, -b.x, b.y, FS_ANIM, 0xf59e0b, 0.7));
      });
      mirrorGroup.add(makeDashedLine(LM[0].x, LM[0].y, FS_ANIM, -LM[0].x, LM[0].y, FS_ANIM, 0xf59e0b, 0.5));
      mirrorGroup.add(makeDashedLine(LM[3].x, LM[3].y, FS_ANIM, -LM[3].x, LM[3].y, FS_ANIM, 0xf59e0b, 0.5));
      ray.bodyGroup.add(mirrorGroup);
    }

    function surfacePanels() {
      statusEl.textContent = '\u25b6 surface \xb7 front + back panels';
      frontFillMesh.material.opacity = 0; frontFillMesh.visible = true;
      backFillMesh.material.opacity  = 0; backFillMesh.visible  = true;
      flLine.material.opacity = 0; flLine.visible = true;
      blLine.material.opacity = 0; blLine.visible = true;
      connData.forEach(cd => { cd.line.material.opacity = 0; cd.line.visible = true; });
      _fadeTarget = 1;
    }

    function showWarning() {
      statusEl.textContent = '\u26a0  world-space \xb7 no body awareness';
      statusEl.style.color = '#fb923c';
      warningEl = document.createElement('div');
      warningEl.textContent = '\u26a0 body changes \u2192 manual rework';
      warningEl.style.cssText = [
        'position:absolute', 'pointer-events:none', 'z-index:122',
        'font:8px "DM Mono",monospace', 'letter-spacing:.1em',
        'color:#fb923c', 'opacity:0', 'transition:opacity 0.4s',
        'background:rgba(10,10,11,0.7)', 'padding:2px 7px', 'border-radius:2px',
        'border-left:2px solid #fb923c',
      ].join(';');
      panel.appendChild(warningEl);
      setTimeout(() => { warningEl.style.opacity = '1'; }, 50);
    }

    const STEP = 900;
    const steps = [
      () => placeLandmark(0),
      () => placeLandmark(1),
      () => placeLandmark(2),
      () => placeLandmark(3),
      () => drawLeftSeams(),
      () => drawRightSide(),
      () => surfacePanels(),
      () => showWarning(),
    ];

    let si = 0;
    function tick() {
      if (si >= steps.length) return;
      steps[si](); si++;
      _stepTimer = setTimeout(tick, STEP);
    }
    tick();
  }

  window._runMethodASvg = runMethodAAnimation;
}
</script>
<script>
let _methodAVisited = false;
function setMethod(m) {
  const panels = document.querySelector('.panels');
  panels.classList.remove('single-a','single-b');
  if(m==='a') panels.classList.add('single-a');
  if(m==='b') panels.classList.add('single-b');
  if(m==='a' && !_methodAVisited) {
    _methodAVisited = true;
    setTimeout(window.replayMethodA, 600);
  }
  // Show/hide relevant UI panels
  const ui3 = document.getElementById('ui3');
  const ui2 = document.getElementById('ui2');
  if(ui3) ui3.style.display = (m==='a') ? 'none' : 'flex';
  // Reposition buttons for single-pane layout
  if(ui2) { ui2.style.display = (m==='a') ? 'none' : 'flex';
             ui2.style.left   = (m==='b') ? '50%' : '75%'; }
  window.dispatchEvent(new Event('resize'));
}
setMethod(window.innerWidth <= 600 ? 'b' : 'b');
</script>
