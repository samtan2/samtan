<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eigengrasp — metabolic</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0d;--bg2:#141416;--bg3:#1a1a1d;--bg4:#222226;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e2e2df;--muted:#7a7a76;--dim:#3a3a38;
  --locked:#4ade80;--active:#60a5fa;--open:#fbbf24;
  --r:5px;--r2:9px;
  --mono:'DM Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;overflow:hidden}
#panel-pane{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.pane-head{
  padding:9px 15px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  flex-shrink:0;
}
#panel-body{flex:1;overflow-y:auto;padding:12px 15px;display:flex;flex-direction:column;gap:16px;min-height:0;}
.zone-label{font-size:9px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:5px;}
.zone-label.locked{color:var(--locked)}
.zone-label.active{color:var(--active)}
.zone-label.open{color:var(--open)}
.empty{font-size:11px;color:var(--dim);padding-left:2px}
.item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;margin-bottom:4px;}
.item:last-child{margin-bottom:0}
.item-text{font-size:12px;line-height:1.45;color:var(--text)}
.item-why{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.35}
.item-tag{font-size:9px;letter-spacing:.06em;display:inline-block;margin-bottom:3px;}
.item-tag.goal{color:var(--locked)}
.item-tag.constraint{color:var(--active)}
.item-tag.assumption{color:var(--open)}
.item-value{font-size:10px;color:var(--active);margin-top:4px;padding:3px 6px;background:var(--bg);border-radius:3px;border:1px solid var(--border);word-break:break-all;line-height:1.4}
.item-options{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
.option-chip{font-size:9px;padding:1px 6px;border-radius:3px;border:1px solid var(--border);color:var(--dim);}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
</style>
</head>
<body>
<div id="panel-pane">
  <div class="pane-head">
    <span>structure</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:11px;color:var(--muted)">metabolic state cockpit</span>
      <span style="font-size:9px;color:var(--dim)">metabolic · 31 params</span>
    </div>
  </div>
  <div id="panel-body">
    <div id="zone-locked"><div class="zone-label locked">locked</div><div class="empty" id="empty-locked">—</div></div>
    <div id="zone-active"><div class="zone-label active">active</div><div class="empty" id="empty-active">—</div></div>
    <div id="zone-open"><div class="zone-label open">open</div><div class="empty" id="empty-open">—</div></div>
  </div>
</div>
<script>
const PARAMS = [
  {
    "id": "rjgmbp",
    "state": "active",
    "tag": "goal",
    "text": "Fast elapsed hours (ring timer)",
    "type": "number",
    "why": "Real-time axis \u2014 driven by the ring timer, not manual input. Everything downstream (zone, arc position, compound routing) derives from this. Locked during a fast, free in preview/slider mode.",
    "value": null,
    "options": null
  },
  {
    "id": "vmnahd",
    "state": "active",
    "tag": "goal",
    "text": "current_heading",
    "type": "text",
    "why": "The \"string\" \u2014 single orienting objective that gives the kite state direction. Not a task list, just the compass heading for this fast window",
    "value": null,
    "options": null
  },
  {
    "id": "aneugd",
    "state": "active",
    "tag": "goal",
    "text": "Arc state (auto-inferred from hours + thresholds)",
    "type": "enum",
    "why": "Derived from elapsed hours against per-fast thresholds (FT). Informs ring color and arc position. Thresholds shift based on meal calibration and mid-fast state overrides.",
    "value": null,
    "options": [
      "fed",
      "depleting",
      "early_ketosis",
      "deep_ketosis"
    ]
  },
  {
    "id": "vvgsgb",
    "state": "active",
    "tag": "goal",
    "text": "electrolyte_status",
    "type": "enum",
    "why": "Electrolytes are the constraint that determines whether fasted state is functional or degraded \u2014 sodium, potassium, magnesium are the load-bearing trio",
    "value": null,
    "options": [
      "none_taken",
      "partial",
      "complete"
    ]
  },
  {
    "id": "yzoaty",
    "state": "active",
    "tag": "goal",
    "text": "Workout position within arc (pre/active/post)",
    "type": "enum",
    "why": "Pre/active/post are positions within the arc, not separate from it. Active = in session, no compounds. Pre = prolactin buffer stack. Post = HPA cooldown. Override propagates remaining thresholds forward or back.",
    "value": null,
    "options": [
      "rest",
      "resistance",
      "cardio",
      "hybrid"
    ]
  },
  {
    "id": "tmkhae",
    "state": "active",
    "tag": "goal",
    "text": "fast_intention",
    "type": "enum",
    "why": "Why this fast \u2014 the reason behind the current protocol window. Fat adaptation, mental clarity, reset, performance, etc. The \"why\" that anchors everything",
    "value": null,
    "options": [
      "fat_adaptation",
      "mental_clarity",
      "metabolic_reset",
      "performance",
      "spiritual"
    ]
  },
  {
    "id": "ucncjc",
    "state": "active",
    "tag": "goal",
    "text": "fast_thresholds",
    "type": "object",
    "why": "Two-layer system: saved baseline T (stable, set in settings) and per-fast FT (recalculated each fast). FT shifts based on meal calibration multiplier or mid-fast state override delta. Resets to T when fast ends.",
    "value": null,
    "options": null
  },
  {
    "id": "nthbkx",
    "state": "active",
    "tag": "goal",
    "text": "meal_calibration",
    "type": "enum",
    "why": "Big meal multiplies all thresholds by 1.15\u20131.6x for this fast only. Surfaces only when selected from state dropdown \u2014 stays hidden otherwise. Resets to baseline T after fast ends.",
    "value": null,
    "options": [
      "none",
      "moderate_1.15x",
      "big_1.35x",
      "very_big_1.6x"
    ]
  },
  {
    "id": "bdksnd",
    "state": "active",
    "tag": "goal",
    "text": "Preview + pause + activePreview (last moved slider owns the arc)",
    "type": "enum",
    "why": "Both fast and refeed have preview sliders free when not running, locked when running. Last moved slider determines which arc previews (activePreview). Pause freezes timer and unlocks slider for manual position adjustment \u2014 resume locks slider and picks up from dragged position. Checks clear when a new phase starts. Starting a phase uses slider position as offset.",
    "value": null,
    "options": [
      "preview_unlocked",
      "fast_running_locked"
    ]
  },
  {
    "id": "youotz",
    "state": "active",
    "tag": "goal",
    "text": "state_definition",
    "type": "object",
    "why": "A state needs four things: a name (label), a threshold hour (when it starts), a compound list (what to take), and a description (why). Everything else \u2014 arc position, routing, next hint \u2014 derives from these four fields.",
    "value": "{\"name\": \"string\", \"threshold_h\": \"number\", \"description\": \"string\", \"compounds\": \"[{name, why}]\"}",
    "options": null
  },
  {
    "id": "urddnk",
    "state": "active",
    "tag": "goal",
    "text": "arc_order",
    "type": "derived",
    "why": "The arc is just the state list sorted by threshold_h. No separate arc config needed \u2014 order is implicit in the thresholds. Reordering = changing threshold values. The arc renders whatever states exist in threshold order.",
    "value": null,
    "options": null
  },
  {
    "id": "nnjoyl",
    "state": "active",
    "tag": "goal",
    "text": "compound_definition",
    "type": "object",
    "why": "A compound needs two things: name and why (mechanism). The why is what makes the stack meaningful vs a dumb list. Both are editable in place in the cockpit.",
    "value": "{\"name\": \"string\", \"why\": \"string\"}",
    "options": null
  },
  {
    "id": "wlaedp",
    "state": "active",
    "tag": "goal",
    "text": "default_state_set",
    "type": "text",
    "why": "The current hardcoded states are the default dataset \u2014 initiate (0h, nicotine), sharpen (4h, alpha GPC + tyrosine), pre (12h, fadogia + p5p + tyrosine + tylenol), active (14h, note only), post (15h, chamomile), recover (16h, liver + salt + sprouts), buffer (24h, ashwagandha + chamomile), extend (36h, pink salt). These carry over as the authored starting point.",
    "value": null,
    "options": null
  },
  {
    "id": "fiejld",
    "state": "active",
    "tag": "goal",
    "text": "State persistence \u2014 daemon state.json primary, localStorage fallback",
    "type": "text",
    "why": "States, compounds, phase, checked compounds all persist to daemon state.json via /state POST. Both phone and laptop read from daemon on load, write on every change. localStorage kept as offline fallback. Edits sync bidirectionally \u2014 edit on laptop, phone gets it on next load. state.json lives at ~/.config/eww/metabolic/state.json.",
    "value": null,
    "options": null
  },
  {
    "id": "tbdpgh",
    "state": "active",
    "tag": "goal",
    "text": "ring_phase",
    "type": "enum",
    "why": "The ring is continuous across both fast and refeed phases. During fasting it depletes toward ketosis. At break-fast it transitions color and direction into refeed mode. One ring, two phases, no hard stop.",
    "value": null,
    "options": [
      "fasting",
      "refeed"
    ]
  },
  {
    "id": "wahwvl",
    "state": "active",
    "tag": "goal",
    "text": "refeed_arc",
    "type": "object",
    "why": "Refeed arc mirrors the fast arc in structure \u2014 authored states with thresholds, but tracking time since eating rather than time since last meal. Default states: fed \u2192 digesting \u2192 clearing \u2192 ready. Ready triggers the fast ring to reappear.",
    "value": "{\"states\": [{\"name\": \"fed\", \"threshold\": 0}, {\"name\": \"digesting\", \"threshold\": 1}, {\"name\": \"clearing\", \"threshold\": 3}, {\"name\": \"ready\", \"threshold\": 6}]}",
    "options": null
  },
  {
    "id": "wvkovs",
    "state": "active",
    "tag": "goal",
    "text": "meal_size_at_break",
    "type": "enum",
    "why": "Meal size at break-fast sets the refeed window length. Moderate multiplies refeed thresholds by 1x (default). Big by 1.4x. Very big by 1.8x. This shifts when \"ready\" arrives, which is when the fast ring reappears. Meal size also pre-calibrates the next fast's arc thresholds \u2014 bigger meal means more glycogen to burn, so fast states arrive later.",
    "value": null,
    "options": [
      "moderate_1x",
      "big_1.4x",
      "very_big_1.8x"
    ]
  },
  {
    "id": "hjbdko",
    "state": "active",
    "tag": "goal",
    "text": "ring_transition",
    "type": "text",
    "why": "The ring transitions at two points: fast \u2192 refeed (break-fast event, ring shifts color and arc) and refeed \u2192 fast (ready state reached or user initiates). The transition carries meal size forward to calibrate the next fast. No hard reset \u2014 one continuous rhythm.",
    "value": "\"break-fast \u2192 refeed ring (meal size sets window) \u2192 ready \u2192 fast ring reappears with calibrated thresholds\"",
    "options": null
  },
  {
    "id": "zgxydc",
    "state": "active",
    "tag": "goal",
    "text": "keto_rhythm",
    "type": "text",
    "why": "Long-term keto rhythm requires tracking both sides of the cycle. The refeed ring enforces the follow-through \u2014 you don't just end a fast, you complete the arc back to ready. This is what makes it a rhythm rather than isolated fasting events.",
    "value": null,
    "options": null
  },
  {
    "id": "ccrvbd",
    "state": "active",
    "tag": "goal",
    "text": "Phase persistence \u2014 daemon-first, bidirectional phone+laptop sync",
    "type": "text",
    "why": "Phase state persists to daemon state.json and localStorage fallback. On restart app reads from daemon first, resumes exactly where left off. Bidirectional \u2014 phone and laptop share the same live state. Compound checks also persist and sync. No onboarding after first launch \u2014 both sliders start at 0, drag to position and hit start.",
    "value": "\"localStorage stores: phase, fastStart, refeedStart, mealSize \u2014 app resumes mid-cycle on relaunch\"",
    "options": null
  },
  {
    "id": "vpwccx",
    "state": "active",
    "tag": "goal",
    "text": "training_intensity_refeed",
    "type": "enum",
    "why": "Training intensity during refeed compresses refeed thresholds, mirror of meal size which extends them. Light (walk/mobility) = 0.95x compression. Moderate (30-40min lifting/cardio) = 0.75x. Hard (long/high intensity) = 0.55x. Compounds with meal size \u2014 big meal + hard training can net out to normal window. Both inputs together determine actual refeed thresholds for this cycle.",
    "value": null,
    "options": [
      "none_1x",
      "light_0.95x",
      "moderate_0.75x",
      "hard_0.55x"
    ]
  },
  {
    "id": "pycqma",
    "state": "active",
    "tag": "goal",
    "text": "refeed_threshold_formula",
    "type": "text",
    "why": "Net refeed thresholds = base threshold * meal_mult * training_compression. Both inputs compound. Big meal (1.8x) + hard training (0.55x) = 0.99x, nearly default. Light meal (1x) + no training (1x) = default. Preview updates live as either input changes \u2014 user can feel the tradeoff before committing.",
    "value": "\"threshold_effective = threshold_base * meal_mult * training_compression\"",
    "options": null
  },
  {
    "id": "qpfmop",
    "state": "active",
    "tag": "goal",
    "text": "bidirectional_preview",
    "type": "text",
    "why": "Refeed has its own preview slider, symmetric with fast slider. When not in refeed, slider is free \u2014 drag to preview refeed arc at any hour, see which state you'd be in and when ready arrives. Training intensity and meal size inputs update arc live in preview. When in active refeed, slider locks to real timer. Bidirectional: fast slider previews fast arc, refeed slider previews refeed arc.",
    "value": "\"fast_slider: free in preview, locked during fast | refeed_slider: free in preview, locked during refeed | both update arc + thresholds live\"",
    "options": null
  },
  {
    "id": "schmkt",
    "state": "active",
    "tag": "goal",
    "text": "activity_label",
    "type": "text",
    "why": "Activity label on each arc state \u2014 what you're doing during that window. HDA work, training, reading, doom scrolling, sleeping, etc. Authored dropdown same pattern as compounds. Goes to the log on snapshot so patterns become visible over time: which states correlate with productive vs wasted windows.",
    "value": null,
    "options": null
  },
  {
    "id": "vtwvux",
    "state": "active",
    "tag": "goal",
    "text": "Calibration pills \u2014 live during refeed, ghost trail shows previous committed value",
    "type": "text",
    "why": "Meal size and training intensity pills always visible in controls. Pills are live during active refeed \u2014 changing either triggers adjustment mode (update refeed / cancel). Pills show ghost trail: previous committed value fades to 35% orange dashed border, current is full opacity. Ghost updates after each commit. Pills unlock during refeed, lock during fast.",
    "value": null,
    "options": null
  },
  {
    "id": "eimdhs",
    "state": "active",
    "tag": "goal",
    "text": "phase_switch",
    "type": "enum",
    "why": "User can switch from fast to refeed or refeed to fast without restarting the app. Switching to refeed re-surfaces meal size and training calibration. Switching to fast resumes from current position. No data loss on switch \u2014 just a phase change.",
    "value": null,
    "options": [
      "fast_to_refeed",
      "refeed_to_fast"
    ]
  },
  {
    "id": "ixxsou",
    "state": "active",
    "tag": "goal",
    "text": "clock_time_from_timer",
    "type": "text",
    "why": "Clock times on arc states are derived for free from fast/refeed start time. No manual anchor needed. Each arc dot shows the real clock time that state starts: state_clock_time = start_timestamp + threshold_hours * 3600000. Ring center shows current state name and countdown to next state. Zero-style: start fast at 9pm, sharpen shows 1am, pre-workout shows 9am, etc.",
    "value": "\"state_clock = start_ms + threshold_h * 3600000 | ring shows: current state name + next state countdown\"",
    "options": null
  },
  {
    "id": "kejvmc",
    "state": "active",
    "tag": "goal",
    "text": "refeed_live_actions",
    "type": "enum",
    "why": "Two live actions during active refeed: \"ate again\" surfaces meal size pills and pushes refeed timer back based on size. \"trained\" surfaces training intensity pills and compresses remaining window. Both are live adjustments \u2014 arc updates in preview as pills are selected. Ring button changes to \"update refeed\" to commit, small cancel button reverts. Committing logs to org file and locks the new thresholds.",
    "value": null,
    "options": [
      "ate_again",
      "trained"
    ]
  },
  {
    "id": "apaonp",
    "state": "active",
    "tag": "goal",
    "text": "ring_btn_as_commit",
    "type": "text",
    "why": "The ring button is the commit for live adjustments. During a refeed adjustment (ate again or trained) the ring button changes from \"stop refeed\" to \"update refeed\". A small cancel button appears next to it. Pressing update refeed commits, locks thresholds, logs to org. Pressing cancel reverts arc to pre-adjustment state. After commit or cancel both disappear and ring button returns to normal.",
    "value": "\"idle: stop refeed | adjusting: update refeed + cancel | committed: stop refeed\"",
    "options": null
  },
  {
    "id": "qgfxss",
    "state": "active",
    "tag": "goal",
    "text": "Refeed adjustment math \u2014 ate again extends forward, training compresses remaining",
    "type": "text",
    "why": "Ate again during refeed: extends ready threshold forward from current position. light: +1h, normal: +2h, big: +4h. Timer keeps running, no reset backward. Training during refeed: compresses remaining window from current position. hard=0.55x, moderate=0.75x, light=0.95x remaining. Both triggered by changing meal/training pills during active refeed \u2014 ring button becomes update refeed, cancel reverts.",
    "value": "\"ate_again: new_ready = max(current_ready, rh) + add_h | trained: new_ready = rh + remaining * train_compress\"",
    "options": null
  },
  {
    "id": "stdcwz",
    "state": "active",
    "tag": "goal",
    "text": "auto_logging",
    "type": "text",
    "why": "Auto-logging fires at key moments without user action: fast_start, fast_stop, fast_resume, refeed_start, refeed_stop, refeed_resume, arc_transition (every 30s check), compound_taken, compound_unchecked, ate_again, trained_during_refeed. Auto entries are compact (** level) in org file. Manual snapshots are full (* level) with all properties. Resume logs on app load if phase was already running.",
    "value": null,
    "options": null
  }
];
function renderPanel() {
  const zones = {locked:[], active:[], open:[]};
  PARAMS.forEach(p => {
    const s = p.state || 'active';
    if(zones[s]) zones[s].push(p);
  });
  ['locked','active','open'].forEach(zone => {
    const container = document.getElementById('zone-'+zone);
    [...container.querySelectorAll('.item')].forEach(el => el.remove());
    const empty = document.getElementById('empty-'+zone);
    if(zones[zone].length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      zones[zone].forEach(p => {
        const el = document.createElement('div');
        el.className = 'item';
        let html = '';
        if(p.tag) html += `<div class="item-tag ${p.tag}">${p.tag}</div>`;
        html += `<div class="item-text">${p.text || ''}</div>`;
        if(p.why) html += `<div class="item-why">${p.why}</div>`;
        if(p.value) html += `<div class="item-value">${JSON.stringify(p.value).replace(/^"|"$/g,'')}</div>`;
        if(p.options && p.options.length) {
          html += `<div class="item-options">${p.options.map(o=>`<span class="option-chip">${o}</span>`).join('')}</div>`;
        }
        el.innerHTML = html;
        container.appendChild(el);
      });
    }
  });
}
renderPanel();
</script>
</body>
</html>
