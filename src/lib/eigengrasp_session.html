<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eigengrasp — session replay</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0d;--bg3:#1a1a1d;--bg4:#222226;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#e2e2df;--muted:#7a7a76;--dim:#3a3a38;
  --locked:#4ade80;--active:#60a5fa;--open:#fbbf24;
  --r:5px;--r2:9px;--mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 2fr;height:100vh}
.pane-head{padding:9px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#chat-pane{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#messages{flex:1;overflow:hidden;padding:12px 15px;display:flex;flex-direction:column;gap:7px;justify-content:flex-end}
.msg{display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:88%;padding:7px 11px;border-radius:var(--r2);font-size:11.5px;line-height:1.55;opacity:0;transform:translateY(5px);transition:opacity .3s ease,transform .3s ease}
.bubble.show{opacity:1;transform:none}
.msg.user .bubble{background:var(--bg4);border:1px solid var(--border2)}
.msg.assistant .bubble{color:var(--muted)}
#step-bar{padding:8px 15px;border-top:1px solid var(--border);display:flex;gap:4px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:var(--dim);transition:background .5s}
.dot.cur{background:var(--open)}
.dot.done{background:rgba(74,222,128,.35)}
#panel-pane{display:flex;flex-direction:column;overflow:hidden}
#panel-body{flex:1;overflow-y:auto;padding:12px 15px;display:flex;flex-direction:column;gap:14px}
.zone-lbl{font-size:9px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:6px}
.zone-lbl.locked{color:var(--locked)}
.zone-lbl.active{color:var(--active)}
.zone-lbl.open{color:var(--open)}
.empty-zone{font-size:11px;color:var(--dim);padding-left:2px}

/* shared item shell */
.item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;margin-bottom:4px;opacity:0;transform:translateY(-5px);transition:opacity .45s ease,transform .45s ease}
.item:last-child{margin-bottom:0}
.item.show{opacity:1;transform:none}
.item.locked-item{border-left:2px solid var(--locked)}
.item.active-item{border-left:2px solid var(--active)}
.item.open-item{border-left:2px solid var(--open)}

/* prose items (human signals session) */
.item-text{font-size:11.5px;line-height:1.45;color:var(--text)}
.item-why{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.35}
.item-opts{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.item-opt{font-size:10px;color:var(--dim)}

/* typed param items (metagrasp session) */
.param-header{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.param-name{font-size:11px;color:var(--text)}
.param-type{font-size:9px;color:var(--dim);letter-spacing:.04em}
.param-tag{font-size:8px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:3px}
.tag-constraint{color:var(--active);background:rgba(96,165,250,.08)}
.tag-goal{color:var(--locked);background:rgba(74,222,128,.08)}
.tag-assumption{color:var(--open);background:rgba(251,191,36,.08)}
/* bool */
.bool-val{font-size:11px;margin-bottom:3px}
.bool-true{color:var(--locked)}
.bool-false{color:var(--dim)}
/* enum */
.enum-opts{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px}
.enum-opt{font-size:9px;padding:2px 7px;border-radius:3px;border:1px solid var(--border);color:var(--dim);letter-spacing:.03em}
.enum-opt.sel{border-color:var(--locked);color:var(--locked);background:rgba(74,222,128,.07)}
.enum-opt.sel-open{border-color:var(--open);color:var(--open);background:rgba(251,191,36,.07)}
/* string */
.string-val{font-size:10.5px;color:var(--muted);margin-bottom:3px}
/* object */
.obj-val{font-size:10px;color:var(--muted);margin-bottom:3px;display:flex;flex-direction:column;gap:2px}
.obj-row{display:flex;gap:5px}
.obj-k{color:var(--dim)}

.items-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:4px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
</style>
</head>

  <div id="chat-pane">

// ─── Rendering ───────────────────────────────────────────────────────────────

const sleep = ms => new Promise(r => setTimeout(r, ms));
const messagesEl = document.getElementById('messages');
const panelBodyEl = document.getElementById('panel-body');
const stepBarEl = document.getElementById('step-bar');
const domainLbl = document.getElementById('domain-lbl');

let gen = 0;
let prevKeys = new Set();

function itemKey(item) {
  return item.name || item.text?.slice(0, 50) || '';
}

function buildDots(count) {
  stepBarEl.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    stepBarEl.appendChild(d);
  }
}

function updateDots(idx, total) {
  for (let i = 0; i < total; i++) {
    const d = document.getElementById(`dot-${i}`);
    if (d) d.className = 'dot' + (i < idx ? ' done' : i === idx ? ' cur' : '');
  }
}

function addMessage(role, text) {
  while (messagesEl.children.length >= 5) messagesEl.removeChild(messagesEl.firstChild);
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  requestAnimationFrame(() => requestAnimationFrame(() => bubble.classList.add('show')));
}

function buildTypedItem(item, zoneCls) {
  const el = document.createElement('div');

  // header: name · type · tag
  const header = document.createElement('div');
  header.className = 'param-header';

  const nm = document.createElement('span');
  nm.className = 'param-name';
  nm.textContent = item.name;
  header.appendChild(nm);

  if (item.type) {
    const tp = document.createElement('span');
    tp.className = 'param-type';
    tp.textContent = item.type;
    header.appendChild(tp);
  }

  if (item.tag) {
    const tg = document.createElement('span');
    tg.className = `param-tag tag-${item.tag}`;
    tg.textContent = item.tag;
    header.appendChild(tg);
  }

  el.appendChild(header);

  // value
  if (item.type === 'bool' && item.value !== undefined && item.value !== null) {
    const v = document.createElement('div');
    v.className = 'bool-val';
    v.innerHTML = item.value
      ? `<span class="bool-true">● true</span>`
      : `<span class="bool-false">○ false</span>`;
    el.appendChild(v);

  } else if (item.type === 'enum' && item.options) {
    const opts = document.createElement('div');
    opts.className = 'enum-opts';
    item.options.forEach(o => {
      const span = document.createElement('span');
      const isSelected = o === item.value;
      span.className = 'enum-opt' + (isSelected ? (zoneCls === 'open' ? ' sel-open' : ' sel') : '');
      span.textContent = o;
      opts.appendChild(span);
    });
    el.appendChild(opts);

  } else if (item.type === 'string' && item.value) {
    const v = document.createElement('div');
    v.className = 'string-val';
    v.textContent = `"${item.value}"`;
    el.appendChild(v);

  } else if (item.type === 'object' && item.value) {
    const obj = document.createElement('div');
    obj.className = 'obj-val';
    Object.entries(item.value).forEach(([k, v]) => {
      const row = document.createElement('div');
      row.className = 'obj-row';
      row.innerHTML = `<span class="obj-k">${k}</span><span>→ ${v}</span>`;
      obj.appendChild(row);
    });
    el.appendChild(obj);
  }

  // why
  if (item.why) {
    const why = document.createElement('div');
    why.className = 'item-why';
    why.textContent = item.why;
    el.appendChild(why);
  }

  return el;
}

function buildProseItem(item) {
  const el = document.createElement('div');

  const txt = document.createElement('div');
  txt.className = 'item-text';
  txt.textContent = item.text;
  el.appendChild(txt);

  if (item.why) {
    const why = document.createElement('div');
    why.className = 'item-why';
    why.textContent = item.why;
    el.appendChild(why);
  }

  if (item.opts) {
    const opts = document.createElement('div');
    opts.className = 'item-opts';
    item.opts.slice(0, 4).forEach(o => {
      const d = document.createElement('div');
      d.className = 'item-opt';
      d.textContent = '· ' + o;
      opts.appendChild(d);
    });
    el.appendChild(opts);
  }

  return el;
}

function renderPanel(panel) {
  panelBodyEl.innerHTML = '';

  function addZone(label, items, cls) {
    const zone = document.createElement('div');
    const lbl = document.createElement('div');
    lbl.className = `zone-lbl ${cls}`;
    lbl.textContent = label;
    zone.appendChild(lbl);

    if (!items.length) {
      const emp = document.createElement('div');
      emp.className = 'empty-zone';
      emp.textContent = '—';
      zone.appendChild(emp);
    } else {
      const container = document.createElement('div');
      if (cls === 'locked') container.className = 'items-grid';
      items.forEach(item => {
        const shell = document.createElement('div');
        shell.className = `item ${cls}-item`;
        const isNew = !prevKeys.has(itemKey(item));
        if (!isNew) shell.classList.add('show');

        const inner = item.name ? buildTypedItem(item, cls) : buildProseItem(item);
        while (inner.firstChild) shell.appendChild(inner.firstChild);

        container.appendChild(shell);
        if (isNew) requestAnimationFrame(() => requestAnimationFrame(() => shell.classList.add('show')));
      });
      zone.appendChild(container);
    }
    panelBodyEl.appendChild(zone);
  }

  addZone('locked', panel.locked, 'locked');
  addZone('active', panel.active, 'active');
  addZone('open', panel.open, 'open');
  prevKeys = new Set([...panel.locked, ...panel.active, ...panel.open].map(itemKey));
}

// ─── Loop ────────────────────────────────────────────────────────────────────

async function runLoop(myGen, key) {
  const session = SESSIONS[key];
  domainLbl.textContent = session.domain.toLowerCase();
  buildDots(session.steps.length);
  renderPanel({ locked: [], active: [], open: [] });

  while (gen === myGen) {
    for (let i = 0; i < session.steps.length; i++) {
      if (gen !== myGen) return;
      const step = session.steps[i];
      updateDots(i, session.steps.length);

      addMessage('user', step.user);
      await sleep(900);
      if (gen !== myGen) return;

      addMessage('assistant', step.assistant);
      await sleep(700);
      if (gen !== myGen) return;

      renderPanel(step.panel);
      await sleep(3200);
      if (gen !== myGen) return;
    }

    await sleep(1200);
    if (gen !== myGen) return;
    prevKeys = new Set();
    messagesEl.innerHTML = '';
    renderPanel({ locked: [], active: [], open: [] });
    await sleep(600);
  }
}

function startSession(key) {
  gen++;
  prevKeys = new Set();
  messagesEl.innerHTML = '';
  runLoop(gen, key);
}

window.addEventListener('message', e => {
  if (e.data?.type === 'switch') startSession(e.data.key);
});

startSession('metagrasp');
